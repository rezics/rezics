version: "3"

tasks:
    dev:
        desc: Start the backend API and recommendation worker.
        env:
            DATABASE_ADMIN_URL: ""
        cmds:
            - task --dir ../.. infra:start
            - task: dev:processes

    dev:processes:
        internal: true
        deps:
            - dev:api
            - dev:worker
        failfast: true

    dev:api:
        internal: true
        cmds:
            - yarn run dev:api

    dev:worker:
        internal: true
        cmds:
            - yarn run dev:worker

    recommendations:refresh:
        desc: Build one recommendation snapshot, aggregate metrics, and exit.
        cmds:
            - yarn exec tsx scripts/refresh-recommendations.ts

    scale-seed:
        desc: Insert local-only, published Book/Software/Media fixtures in bounded batches (does not refresh recommendations).
        cmds:
            - yarn exec tsx scripts/scale-seed.ts seed {{.CLI_ARGS}}

    scale-seed:purge:
        desc: Remove a local scale-seed run by its run id.
        cmds:
            - yarn exec tsx scripts/scale-seed.ts purge {{.CLI_ARGS}}

    aggregates:reconcile:
        desc: Verify authoritative aggregate tables against their source facts.
        cmds:
            - yarn exec tsx scripts/reconcile-aggregates.ts

    content-metrics:rebuild:
        desc: Rebuild locale-aware metrics from current localized Portable Text.
        cmds:
            - yarn exec tsx scripts/rebuild-content-metrics.ts

    studio:rebuild:
        desc: Rebuild Studio's current explicit-editor candidate indexes (maintenance only).
        cmds:
            - yarn exec tsx scripts/rebuild-studio.ts

    participation:rebuild:
        desc: Rebuild the History-owned Profile/resource participation projection (maintenance only).
        cmds:
            - yarn exec tsx scripts/rebuild-participation.ts

    search:index:
        desc: Check or explicitly reindex the canonical authoritative PGroonga indexes.
        cmds:
            - yarn exec tsx scripts/search-index.ts {{.CLI_ARGS}}

    search:capacity:
        desc: Run the destructive PGroonga capacity fixture only on disposable rezics_atlas.
        cmds:
            - yarn exec tsx scripts/benchmark-search-capacity.ts {{.CLI_ARGS}}

    filter-documents:migrate:
        desc: Rewrite preview Search/Zone documents to sparse FilterDocuments in bounded batches.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-filter-documents.ts {{.CLI_ARGS}}

    storage:prepare:
        desc: Idempotently prepare the loopback object-storage bucket used by local development.
        cmds:
            - yarn exec tsx scripts/ensure-local-storage-bucket.ts

    build:
        desc: Build the backend.
        cmds:
            - yarn exec tsc -p tsconfig.json

    typecheck:
        desc: Type-check the backend.
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.typecheck.json

    counts:check:
        desc: Reject online exact count scans outside the reviewed bounded allowlist.
        cmds:
            - yarn exec tsx scripts/check-online-counts.ts

    test:
        desc: Run backend behavior tests.
        dir: ../..
        cmds:
            - yarn exec vitest run --project main

    openapi:generate:
        desc: Generate the OpenAPI document from backend route schemas.
        cmds:
            - yarn exec tsx scripts/generate-openapi.ts

    db:auth:
        desc: Verify that Better Auth model requirements match the mapped schema.
        cmds:
            - yarn exec tsx scripts/generate-auth-schema.ts

    db:replay:up:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test up -d --wait postgres-migration-test

    db:replay:down:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test rm --stop --force postgres-migration-test

    db:replay:reset:
        internal: true
        cmds:
            - task: db:replay:down
            - task: db:replay:up

    db:atlas:check:
        desc: Verify an Atlas CLI version compatible with REZICS.
        cmds:
            - yarn exec atlas version

    db:generate:
        desc: Replay migrations into a shadow database and diff it against the Drizzle schema.
        cmds:
            - test -n "{{.CLI_ARGS}}"
            - task: db:validate
            - defer: { task: db:replay:down }
            - task: db:replay:reset
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
            - yarn exec tsx scripts/generate-database-migration.ts {{.CLI_ARGS}}

    db:hash:
        desc: Recompute the Atlas migration directory checksum.
        cmds:
            - yarn exec atlas migrate hash --env main

    db:validate:
        desc: Validate the Atlas migration checksum without replaying the database.
        cmds:
            - yarn exec atlas migrate validate --dir file://src/services/database/migrations

    db:constraints:
        desc: Show or validate one staged integrity constraint.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/validate-integrity-constraints.ts {{.CLI_ARGS}}

    db:vndb-v11:preflight:
        desc: Classify the v11 migration phase and block unsafe partial or invalid-index recovery.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight {{.CLI_ARGS}}

    db:vndb-v11:prepare:
        desc: Apply only the additive transactional v11 prepare migration, reconcile control privileges, and validate its four online checks.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - test "{{.CLI_ARGS}}" = "--yes"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight --expect-state legacy
            - >-
                PGOPTIONS='-c search_path=public,pg_catalog -c lock_timeout=5s -c statement_timeout=30min -c idle_in_transaction_session_timeout=60s'
                yarn exec atlas migrate apply 1 --env main --url "${DATABASE_ADMIN_URL}"
                --lock-timeout 5s
            - yarn exec tsx scripts/ensure-database-privileges.ts
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode validate-prepare --yes
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight --expect-state prepared

    db:vndb-v11:primary-path-backfill:
        desc: With legacy writers live, keyset-backfill the versioned primary-path projection and drain its durable delta queue.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode primary-path-backfill {{.CLI_ARGS}}

    db:vndb-v11:preindex:
        desc: With legacy writers live, apply exactly the v11 concurrent-index migration and prove preindexed state.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - test "{{.CLI_ARGS}}" = "--yes"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight --expect-state prepared
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode primary-path-backfill --yes
            - >-
                PGOPTIONS='-c search_path=public,pg_catalog -c lock_timeout=5s -c statement_timeout=30min -c idle_in_transaction_session_timeout=60s'
                yarn exec atlas migrate apply 1 --env main --url "${DATABASE_ADMIN_URL}"
                --lock-timeout 5s
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight --expect-state preindexed

    db:vndb-v11:pause:
        desc: Close the durable advisory writer fence and prove all merge and correction work drained before contract.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - test -n "{{.CLI_ARGS}}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode pause {{.CLI_ARGS}}

    db:vndb-v11:primary-path-verify:
        desc: Under the paused durable fence, drain primary-path deltas and seal projection parity for the current transition epoch.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode primary-path-verify {{.CLI_ARGS}}

    db:vndb-v11:contract:
        desc: After all judgment and Unit-merge work is paused, drained, and lease-fenced, apply exactly the transactional v11 contract.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - test "{{.CLI_ARGS}}" = "--yes"
            - >-
                yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight
                --expect-state preindexed --require-drained
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode primary-path-verify --yes
            - >-
                PGOPTIONS='-c search_path=public,pg_catalog -c lock_timeout=5s -c statement_timeout=30min -c idle_in_transaction_session_timeout=60s -c rezics.vndb_v11_writers=paused-and-drained -c rezics.vndb_v11_binary_contract=vndb-v11-contract-v1'
                yarn exec atlas migrate apply 1 --env main --url "${DATABASE_ADMIN_URL}"
                --lock-timeout 5s
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode preflight --expect-state final

    db:vndb-v11:migrate-guard:
        internal: true
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode migrate-guard

    db:vndb-v11:backfill:
        desc: While judgment and Unit-merge writers/workers remain paused, backfill v11 timestamps in bounded resumable batches.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode backfill {{.CLI_ARGS}}

    db:vndb-v11:validate:
        desc: Validate staged v11 constraints online after matching binaries deploy and before writers resume.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode validate {{.CLI_ARGS}}

    db:vndb-v11:verify:
        desc: Before resuming writers, verify v11 timestamps, constraints, and all judgment aggregate projections.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode verify {{.CLI_ARGS}}

    db:vndb-v11:resume:
        desc: Recheck the exact paused-epoch proof and reopen writes only for matching v11 binaries.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - test -n "{{.CLI_ARGS}}"
            - yarn exec tsx scripts/migrate-vndb-v11-judgments.ts --mode resume {{.CLI_ARGS}}

    db:vndb-v11:check:
        desc: Verify v11 persistence invariants against a disposable localhost rezics_atlas database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 yarn exec tsx scripts/check-vndb-v11-contract.ts

    db:postgres-schema:
        desc: Verify migration-owned PostgreSQL functions, triggers, and current Structure views against canonical SQL.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/check-postgres-schema.ts

    db:check:
        desc: Replay migrations and verify that they match the Drizzle schema.
        cmds:
            - task: db:validate
            - defer: { task: db:replay:down }
            - task: db:replay:reset
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                --to-version 20260809000003
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-studio-workspace-cutover.ts seed
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                --to-version 20260811000002
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-filter-document-cutover.ts seed
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/migrate-filter-documents.ts --yes --batch-size 2
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/migrate-filter-documents.ts --yes --batch-size 2
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-bootstrap-unit-merge-access-cutover.ts seed
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                --to-version 20260811190000
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/migrate-filter-documents.ts --yes --batch-size 2
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-studio-workspace-cutover.ts verify-and-clean
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-filter-document-cutover.ts verify-and-clean
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-bootstrap-unit-merge-access-cutover.ts verify-and-clean
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-governance-rule-cutover.ts seed
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-governance-rule-cutover.ts verify-and-clean
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-governance-rule-decisions.ts
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-revision-primary-contribution.ts
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-vndb-v11-contract.ts
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-postgres-schema.ts
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/validate-integrity-constraints.ts validate-disposable
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/search-index.ts check
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-database-schema-drift.ts

    db:migrate:dry-run:
        desc: Print pending Atlas migrations without applying them.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec atlas migrate apply --env main --url "${DATABASE_ADMIN_URL}" --dry-run

    db:migrate:
        desc: Apply pending Atlas migrations and reconcile application privileges.
        cmds:
            - task: db:atlas:check
            - test -n "${DATABASE_ADMIN_URL:-}"
            - task: db:vndb-v11:migrate-guard
            - task: filter-documents:migrate
              vars:
                  CLI_ARGS: --yes
            - >-
                PGOPTIONS='-c search_path=public,pg_catalog -c lock_timeout=5s -c statement_timeout=30min -c idle_in_transaction_session_timeout=60s'
                yarn exec atlas migrate apply --env main --url "${DATABASE_ADMIN_URL}"
                --lock-timeout 5s
            - yarn exec tsx scripts/ensure-database-privileges.ts

    db:preflight:
        desc: Read-only validation of migration history.
        cmds:
            - task: db:validate
            - task: db:status

    db:runtime:verify:
        desc: Verify PostgreSQL runtime settings, statistics, and extension health.
        cmds:
            - yarn exec tsx scripts/verify-postgres-runtime.ts

    db:project:
        desc: Rebuild derived database projections after application promotion.
        cmds:
            - task: content-metrics:rebuild
            - task: studio:rebuild
            - task: participation:rebuild

    platform:install:
        desc: Ensure reserved platform identities; insert missing IDs with starter content only.
        cmds:
            - yarn exec tsx scripts/install-platform.ts {{.CLI_ARGS}}

    official-rules:seed:
        desc: Locally publish starter Rules when the official Realm has no history; never run in production.
        cmds:
            - yarn exec tsx scripts/seed-official-rule-realm.ts {{.CLI_ARGS}}

    bootstrap:curated-collections:
        desc: Alias for platform:install; reserved Tag Collection IDs are part of the identity graph.
        cmds:
            - task: platform:install
              vars:
                  CLI_ARGS: "{{.CLI_ARGS}}"

    platform:installation:check:
        desc: Verify a fresh empty-database first write against the factory snapshot. Not a deploy gate.
        cmds:
            - yarn exec tsx scripts/check-platform-installation.ts

    platform:verify:
        desc: Read-only verification of permanent platform identities.
        cmds:
            - yarn exec tsx scripts/verify-platform-core.ts

    platform:credentials:rotate:
        desc: Rotate every platform Profile password and print the new credentials.
        prompt: This rotates all platform Profile passwords. Continue?
        cmds:
            - yarn exec tsx scripts/rotate-platform-credentials.ts --yes

    db:install:
        desc: Migrate and ensure reserved Bootstrap identities before an application's first deployment.
        cmds:
            - task: db:migrate
            - task: platform:install
              vars:
                  CLI_ARGS: "{{.CLI_ARGS}}"
            - task: platform:verify
            - task: db:runtime:verify
            - task: db:project

    db:prepare:
        desc: Preflight, migrate, ensure reserved identities, and verify an installed database.
        cmds:
            - task: db:preflight
            - task: db:migrate
            - task: platform:install
              vars:
                  CLI_ARGS: --yes
            - task: db:runtime:verify
            - task: platform:verify

    db:status:
        desc: Show Atlas migration status.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec atlas migrate status --env main --url "${DATABASE_ADMIN_URL}"

    content-pack:apply:
        desc: Idempotent replay of showcase packs from a sibling checkout or --from directory.
        cmds:
            - yarn exec tsx scripts/content-pack.ts apply {{.CLI_ARGS}}

    content-pack:plan:
        desc: Preview showcase pack installation without writing Units.
        cmds:
            - yarn exec tsx scripts/content-pack.ts plan {{.CLI_ARGS}}

    content-pack:verify:
        desc: Verify an installed showcase pack against the local checkout.
        cmds:
            - yarn exec tsx scripts/content-pack.ts verify {{.CLI_ARGS}}

    content-pack:status:
        desc: List installed showcase packs.
        cmds:
            - yarn exec tsx scripts/content-pack.ts status {{.CLI_ARGS}}

    db:reset-bootstrap:
        desc: Reset the local database and install Bootstrap only (no Seed, no showcase packs).
        internal: true
        cmds:
            - task: db:atlas:check
            - yarn exec tsx scripts/reset-database.ts {{.CLI_ARGS}}
            - task: db:install
              vars:
                  CLI_ARGS: --yes

    db:seed:
        desc: Build local/CI platform infrastructure and Fixtures, then rebuild derived projections.
        cmds:
            - yarn exec tsx scripts/seed.ts {{.CLI_ARGS}}
            - task: platform:verify
            - task: content-metrics:rebuild
            - task: studio:rebuild
            - task: recommendations:refresh
            - task: aggregates:reconcile
            - task: db:seed:check
              vars:
                  CLI_ARGS: "{{.CLI_ARGS}}"

    db:seed:check:
        desc: Verify the selected Seed profile and all derived database postconditions.
        cmds:
            - yarn exec tsx scripts/check-seed.ts {{.CLI_ARGS}}

    db:seed:search:check:
        desc: Verify official Zone fixtures against authoritative PostgreSQL Search.
        cmds:
            - yarn exec tsx scripts/check-seed-search.ts

    db:reset:
        desc: Internal database-only reset; PGroonga indexes are maintained by PostgreSQL.
        internal: true
        cmds:
            - task: db:atlas:check
            - yarn exec tsx scripts/reset-database.ts {{.CLI_ARGS}}
            - task: db:install
              vars:
                  CLI_ARGS: --yes
            - task: db:seed
