version: "3"

tasks:
    dev:
        desc: Start the backend API and recommendation worker.
        env:
            DATABASE_ADMIN_URL: ""
        cmds:
            - task --dir ../.. infra:start
            - task: dev:processes

    dev:processes:
        internal: true
        deps:
            - dev:api
            - dev:worker
        failfast: true

    dev:api:
        internal: true
        cmds:
            - yarn run dev:api

    dev:worker:
        internal: true
        cmds:
            - yarn run dev:worker

    recommendations:refresh:
        desc: Build one recommendation snapshot, aggregate metrics, and exit.
        cmds:
            - yarn exec tsx scripts/refresh-recommendations.ts

    aggregates:reconcile:
        desc: Verify authoritative aggregate tables against their source facts.
        cmds:
            - yarn exec tsx scripts/reconcile-aggregates.ts

    content-metrics:rebuild:
        desc: Rebuild locale-aware metrics from current localized Portable Text.
        cmds:
            - yarn exec tsx scripts/rebuild-content-metrics.ts

    studio:rebuild:
        desc: Rebuild the personalized Studio work-relation projection.
        cmds:
            - yarn exec tsx scripts/rebuild-studio.ts

    search:index:
        desc: Check or explicitly manage one versioned Meilisearch projection generation.
        cmds:
            - yarn exec tsx scripts/search-index.ts {{.CLI_ARGS}}

    storage:prepare:
        desc: Idempotently prepare the loopback object-storage bucket used by local development.
        cmds:
            - yarn exec tsx scripts/ensure-local-storage-bucket.ts

    search:config:check:
        desc: Interpolate and plan the canonical Sequin search configuration.
        cmds:
            - sequin config interpolate search/sequin.yaml --output ../../.temp/sequin.interpolated.yaml
            - sequin config plan ../../.temp/sequin.interpolated.yaml

    build:
        desc: Build the backend.
        cmds:
            - yarn exec tsc -p tsconfig.json

    typecheck:
        desc: Type-check the backend.
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.typecheck.json

    test:
        desc: Run backend behavior tests.
        dir: ../..
        cmds:
            - yarn exec vitest run --project main

    openapi:generate:
        desc: Generate the OpenAPI document from backend route schemas.
        cmds:
            - yarn exec tsx scripts/generate-openapi.ts

    db:auth:
        desc: Verify that Better Auth model requirements match the mapped schema.
        cmds:
            - yarn exec tsx scripts/generate-auth-schema.ts

    db:replay:up:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test up -d --wait postgres-migration-test

    db:replay:down:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test rm --stop --force postgres-migration-test

    db:replay:reset:
        internal: true
        cmds:
            - task: db:replay:down
            - task: db:replay:up

    db:generate:
        desc: Generate an Atlas migration from the Drizzle schema.
        cmds:
            - test -n "{{.CLI_ARGS}}"
            - defer: { task: db:replay:down }
            - task: db:replay:up
            - yarn exec atlas migrate diff --env main {{.CLI_ARGS}}

    db:hash:
        desc: Recompute the Atlas migration directory checksum.
        cmds:
            - yarn exec atlas migrate hash --env main

    db:validate:
        desc: Validate the Atlas migration checksum without replaying the database.
        cmds:
            - yarn exec atlas migrate validate --dir file://src/services/database/migrations

    db:check:
        desc: Replay migrations and verify that they match the Drizzle schema.
        cmds:
            - task: db:validate
            - defer: { task: db:replay:down }
            - task: db:replay:reset
            - >-
                yarn exec atlas migrate apply --env main
                --url 'postgres://postgres:postgres@localhost:5433/rezics_atlas?search_path=public&sslmode=disable'
            - >-
                yarn exec atlas schema diff --env main
                --from 'postgres://postgres:postgres@localhost:5433/rezics_atlas?search_path=public&sslmode=disable'
                --to env://schema.src
                --exclude atlas_schema_revisions
                --exclude '*[type=extension|function|trigger]'
                | grep -q '^Schemas are synced, no changes to be made\.$'

    db:migrate:dry-run:
        desc: Print pending Atlas migrations without applying them.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec atlas migrate apply --env main --url "${DATABASE_ADMIN_URL}" --dry-run

    db:migrate:
        desc: Apply pending Atlas migrations and reconcile application privileges.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec atlas migrate apply --env main --url "${DATABASE_ADMIN_URL}"
            - yarn exec tsx scripts/ensure-database-privileges.ts

    db:bootstrap:
        desc: Fill missing bootstrap records without changing existing credentials.
        cmds:
            - yarn exec tsx scripts/bootstrap.ts

    db:bootstrap:check:
        desc: Verify that the database has all required bootstrap records.
        cmds:
            - yarn exec tsx scripts/check-bootstrap.ts

    db:bootstrap:credentials:overwrite:
        desc: Replace every bootstrap Profile password and print the new credentials.
        prompt: This replaces all bootstrap Profile passwords. Continue?
        cmds:
            - yarn exec tsx scripts/bootstrap.ts --overwrite-credentials --yes

    db:prepare:
        desc: Migrate and bootstrap a database for application traffic.
        cmds:
            - task: db:migrate
            - task: db:bootstrap
            - task: content-metrics:rebuild
            - task: studio:rebuild

    db:status:
        desc: Show Atlas migration status.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec atlas migrate status --env main --url "${DATABASE_ADMIN_URL}"

    db:seed:
        desc: Run the independent Seed service and rebuild every derived database projection.
        cmds:
            - yarn exec tsx scripts/seed.ts {{.CLI_ARGS}}
            - task: db:bootstrap
            - task: content-metrics:rebuild
            - task: studio:rebuild
            - task: recommendations:refresh
            - task: aggregates:reconcile
            - task: db:seed:check
              vars:
                  CLI_ARGS: "{{.CLI_ARGS}}"

    db:seed:check:
        desc: Verify the selected Seed profile and all derived database postconditions.
        cmds:
            - yarn exec tsx scripts/check-seed.ts {{.CLI_ARGS}}

    db:seed:search:check:
        desc: Verify official Zone fixtures against the promoted external Search projection.
        cmds:
            - yarn exec tsx scripts/check-seed-search.ts

    db:reset:
        desc: Internal database-only reset; use the root local:reset task to keep search consistent.
        internal: true
        cmds:
            - yarn exec tsx scripts/reset-database.ts {{.CLI_ARGS}}
            - task: db:prepare
            - task: db:seed
