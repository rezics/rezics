version: "3"

tasks:
    dev:
        desc: Start the backend API and recommendation worker.
        env:
            DATABASE_ADMIN_URL: ""
        cmds:
            - task --dir ../.. infra:start
            - task: dev:processes

    dev:processes:
        internal: true
        deps:
            - dev:api
            - dev:worker
        failfast: true

    dev:api:
        internal: true
        cmds:
            - yarn run dev:api

    dev:worker:
        internal: true
        cmds:
            - yarn run dev:worker

    recommendations:refresh:
        desc: Build one recommendation snapshot, aggregate metrics, and exit.
        cmds:
            - yarn exec tsx scripts/refresh-recommendations.ts

    aggregates:reconcile:
        desc: Verify authoritative aggregate tables against their source facts.
        cmds:
            - yarn exec tsx scripts/reconcile-aggregates.ts

    content-metrics:rebuild:
        desc: Rebuild locale-aware metrics from current localized Portable Text.
        cmds:
            - yarn exec tsx scripts/rebuild-content-metrics.ts

    studio:rebuild:
        desc: Rebuild Studio's current explicit-editor candidate indexes (maintenance only).
        cmds:
            - yarn exec tsx scripts/rebuild-studio.ts

    participation:rebuild:
        desc: Rebuild the History-owned Profile/resource participation projection (maintenance only).
        cmds:
            - yarn exec tsx scripts/rebuild-participation.ts

    tag-expression-projections:rebuild:
        desc: Rebuild Unit Effective Tag projections in bounded Expression/authority pages.
        cmds:
            - yarn exec tsx scripts/rebuild-tag-expression-projections.ts

    search:index:
        desc: Check or explicitly reindex the canonical authoritative PGroonga indexes.
        cmds:
            - yarn exec tsx scripts/search-index.ts {{.CLI_ARGS}}

    search:capacity:
        desc: Run the destructive PGroonga capacity fixture only on disposable rezics_atlas.
        cmds:
            - yarn exec tsx scripts/benchmark-search-capacity.ts {{.CLI_ARGS}}

    tag-path:capacity:
        desc: Qualify bounded Tag Path plans and hot-key writes only on disposable rezics_atlas.
        cmds:
            - yarn exec tsx scripts/benchmark-tag-path-capacity.ts {{.CLI_ARGS}}

    auth-identity:check:
        desc: Verify current authentication identity constraints.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/check-auth-identity.ts

    storage:prepare:
        desc: Idempotently prepare the loopback object-storage bucket used by local development.
        cmds:
            - yarn exec tsx scripts/ensure-local-storage-bucket.ts

    build:
        desc: Build the backend.
        cmds:
            - yarn exec tsc -p tsconfig.json

    typecheck:
        desc: Type-check the backend.
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.typecheck.json

    counts:check:
        desc: Reject online exact count scans outside the reviewed bounded allowlist.
        cmds:
            - yarn exec tsx scripts/check-online-counts.ts

    test:
        desc: Run backend behavior tests.
        dir: ../..
        cmds:
            - yarn exec vitest run --project main

    performance:tools:
        desc: Build the pinned gMark relationship generator; does not start application infrastructure.
        dir: ../..
        cmds:
            - docker compose build postgres
            - docker build --file services/main/performance/gmark.Dockerfile --tag rezics-gmark:77be5b6 .

    performance:run:
        desc: Generate relationship workloads and measure the real API on a new disposable PostgreSQL container.
        cmds:
            - yarn exec tsx scripts/performance/run.ts {{.CLI_ARGS}}

    performance:diagnostics:check:
        desc: Verify native core capture after aborting only a backend in a new run-owned scratch container.
        cmds:
            - yarn exec tsx scripts/check-performance-diagnostics.ts

    performance:sql-replay:check:
        desc: Verify changed SQL and failed native logs when reusing a scratch performance container.
        cmds:
            - yarn exec tsx scripts/check-performance-sql-replay.ts

    performance:connection-loss:check:
        desc: Verify failed-run reporting after terminating the exact idle harness backend in a retained performance dataset.
        cmds:
            - yarn exec tsx scripts/check-performance-connection-loss.ts {{.CLI_ARGS}}

    performance:check:
        desc: Check performance harness integrity without creating data or starting servers.
        dir: ../..
        cmds:
            - task: typecheck
            - yarn exec vitest run --project main services/main/scripts/performance

    openapi:generate:
        desc: Generate the OpenAPI document from backend route schemas.
        cmds:
            - yarn exec tsx scripts/generate-openapi.ts

    db:auth:
        desc: Verify that Better Auth model requirements match the mapped schema.
        cmds:
            - yarn exec tsx scripts/generate-auth-schema.ts

    email:check:
        desc: Verify email claim races on an empty loopback rezics_atlas replay database.
        cmds:
            - yarn exec tsx scripts/check-email-outbox.ts

    db:inventory:
        desc: Capture read-only schema/runtime metadata using DATABASE_INVENTORY_URL and scope local or production.
        cmds:
            - yarn exec tsx scripts/inventory-database.ts {{.CLI_ARGS}}

    catalog:sources:inventory:
        desc: Verify or regenerate the pinned catalog declaration inventory using a cache under repository .temp.
        cmds:
            - yarn exec tsx scripts/generate-catalog-source-inventory.ts {{.CLI_ARGS}}

    catalog:sources:coverage:
        desc: Check pinned source dispositions and evidence; --inspect reports unresolved coverage without qualifying it.
        cmds:
            - yarn exec tsx scripts/check-catalog-source-coverage.ts {{.CLI_ARGS}}

    catalog:check-contexts:
        desc: Verify context revision constraints on an explicitly configured disposable loopback database.
        cmds:
            - bun scripts/check-software-participation-contexts.ts

    catalog:check-context-concurrency:
        desc: Verify scoped authoring races only on the disposable rezics_atlas_contexts_concurrency database.
        cmds:
            - bun scripts/check-software-participation-concurrency.ts

    catalog:context-capacity:
        desc: Measure rollback-only skewed context and source-mapping query plans on a disposable target.
        cmds:
            - bun scripts/check-software-participation-capacity.ts

    catalog:check-source-events:
        desc: Verify atomic observation/outbox writes and admission rollback on a disposable target.
        cmds:
            - bun scripts/check-catalog-source-events.ts

    events:check-transport:
        desc: Verify transport contracts against an explicitly configured disposable loopback JetStream server.
        cmds:
            - bun scripts/check-event-transport.ts

    events:check-durability:
        desc: Verify exact-operation fencing, receipts, admission and races on a disposable database.
        cmds:
            - bun scripts/check-operational-durability.ts

    events:check-partitions:
        desc: Verify the operational partition placement and inherited integrity triggers.
        cmds:
            - bun scripts/check-operational-partitions.ts

    events:worker:
        desc: Run the source event/task worker with explicit broker, bucket and admission configuration.
        env:
            DATABASE_ADMIN_URL: ""
        cmds:
            - bun src/event-worker.ts

    events:check-runtime:
        desc: Verify event/task receipts, recovery and checkpoints on explicitly configured disposable services.
        cmds:
            - bun scripts/check-event-runtime.ts

    events:check-source-runtime:
        desc: Verify source checks through committed NATS task intents and database receipts.
        cmds:
            - bun scripts/check-source-check-runtime.ts

    events:check-debezium:
        desc: Qualify the pinned relay with explicitly opted-in isolated containers.
        cmds:
            - bun scripts/check-debezium-relay.ts

    catalog:check-local:
        desc: Verify native catalog commands and constraints on the loopback rezics-dev database with disposable fixtures.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-catalog-native-foundation.ts
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-catalog-domains.ts

    catalog:benchmark-local:
        desc: Measure native relation query plans using rollback-only fixtures on rezics-dev PostgreSQL.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/benchmark-catalog-native.ts

    catalog:check-source-local:
        desc: Verify native Bangumi adoption and roundtrip using a supplied payload or one public API read.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-catalog-source-adoption.ts {{.CLI_ARGS}}

    catalog:check-books-local:
        desc: Verify book-index native Work/Edition adoption against two public Open Library records.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-openlibrary-adoption.ts

    catalog:check-vndb-local:
        desc: Verify VN identity and source-context roundtrip against one selected public VNDB record.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-vndb-adoption.ts

    catalog:check-music-local:
        desc: Verify MusicBrainz release, recording and track adoption from one public source graph.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-musicbrainz-adoption.ts

    db:replay:up:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test up -d --wait postgres-migration-test

    db:replay:down:
        internal: true
        dir: ../..
        cmds:
            - docker compose --profile migration-test rm --stop --force postgres-migration-test

    db:replay:reset:
        internal: true
        cmds:
            - task: db:replay:down
            - task: db:replay:up

    db:fixture:prepare:
        desc: Reset only the disposable Atlas service and leave a fresh native database running for domain fixtures.
        cmds:
            - task: db:validate
            - task: db:replay:reset
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-baseline-epoch.ts preflight
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-baseline-epoch.ts installed

    db:fixture:stop:
        desc: Remove the disposable Atlas fixture service; preserve the application development database.
        cmds:
            - task: db:replay:down

    db:atlas:check:
        desc: Verify an Atlas CLI version compatible with REZICS.
        cmds:
            - yarn exec atlas version

    db:generate:
        desc: Replay migrations into a shadow database and diff it against the Drizzle schema.
        cmds:
            - test -n "{{.CLI_ARGS}}"
            - task: db:validate
            - defer: { task: db:replay:down }
            - task: db:replay:reset
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
            - yarn exec tsx scripts/generate-database-migration.ts {{.CLI_ARGS}}

    db:baseline:
        desc: Generate the explicitly authorized fresh native baseline before its first release.
        cmds:
            - yarn exec tsx scripts/generate-native-baseline.ts

    db:hash:
        desc: Recompute the Atlas migration directory checksum.
        cmds:
            - yarn exec atlas migrate hash --env main

    db:validate:
        desc: Validate the Atlas migration checksum without replaying the database.
        cmds:
            - yarn exec atlas migrate validate --dir file://src/services/database/migrations

    db:constraints:
        desc: Show or validate one staged integrity constraint.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/validate-integrity-constraints.ts {{.CLI_ARGS}}

    db:postgres-schema:
        desc: Verify migration-owned PostgreSQL functions, triggers, and canonical domain objects against canonical SQL.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - yarn exec tsx scripts/check-postgres-schema.ts

    db:references:check:
        desc: Verify identity and exact catalog revision values and races on an installed disposable Atlas database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 yarn exec tsx scripts/check-reference-values.ts

    db:participation:check:
        desc: Verify principal admission, delegation, revocation, presentation and recovery on an installed disposable Atlas database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-participation-authority.ts

    db:following-references:check:
        desc: Verify canonical Follow references, private preferences, counters, defaults and indexed readers.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-following-references.ts

    db:progress-authority:check:
        desc: Verify current Progress account/Self and parent-read authority, lock races and stateful HTTP journal commands.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-progress-command-authority.ts
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-progress-authority.ts

    db:studio-visit-references:check:
        desc: Verify canonical private Studio visits, native listing IDs, merge guards, erasure and selective plans.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-studio-visit-references.ts

    db:studio-visits:check:
        desc: Verify current Studio visit authority, monotonic timestamps and observed lock races.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-studio-visit-authority.ts

    db:following-authority:check:
        desc: Verify current Following Self/account authority, target/expiry races and private setting boundaries.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-following-authority.ts

    db:private-lifecycle:check:
        desc: Verify private Favorites references, concurrent commands and bounded account erasure on a disposable Atlas database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-private-account-lifecycle.ts

    db:access-expiry:check:
        desc: Verify current-statement grant and restriction expiry, including a platform grant row-lock wait.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-access-expiry.ts

    db:account-tags:check:
        desc: Verify private Tag canonical references, filter privacy, erasure and indexed native-ID joins.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-account-tag-references.ts

    db:read-scopes:check:
        desc: Verify root and descendant read scopes, restrictions and list/point agreement on a disposable database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-unit-read-scopes.ts

    db:membership:check:
        desc: Verify organization membership HTTP/SQL transitions, private data boundaries and exact revocation races.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-organization-membership.ts

    db:membership-recovery:check:
        desc: Verify membership suspension/generation fencing and current recovery authority across expiry and lock waits.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-membership-recovery.ts

    db:membership-capacity:check:
        desc: Verify both pending-invitation limits, reclamation and competing last-slot admission on a disposable database.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-membership-capacity.ts

    db:platform-user-authority:check:
        desc: Verify current platform account/session authority, account transitions and lock-wait races on the disposable target.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-platform-user-authority.ts

    db:account-participation:check:
        desc: Verify account state/enforcement on Favorites, membership and catalog intake, including both transaction orders and signed-session APIs.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-account-participation.ts

    db:realm-membership:check:
        desc: Verify Realm membership transitions, rule consent and current authority under cross-connection races on the disposable target.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-realm-membership.ts

    db:realm-roster:check:
        desc: Verify native Realm member presentation, bounded cursor traversal, query plans and current read authority.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-realm-roster.ts

    db:reference-merge:check:
        desc: Verify real public merge approvals/canonicalization and sequential transaction snapshot reads for reference fixtures.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-reference-merge.ts

    db:recommendation-references:check:
        desc: Verify canonical private recommendation exclusions, filters, current authority, merge guards and erasure.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-recommendation-references.ts

    db:private-merge-review:check:
        desc: Verify explicit private-pair read grants and canonical target audience for retained sources.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-private-merge-review.ts

    db:merge:check:
        desc: Qualify native merge policy, private HTTP reviews and reconciliation in an isolated merge lane without unfinished jobs.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-unit-merge-review-policy.ts

    db:merge-recovery:check:
        desc: Verify merge worker process crash, lease replay, receipts and current executor authority.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-merge-recovery.ts

    db:merge-review-application:check:
        desc: Verify exact reviewer receipts, current authority at canonicalization and deadline/revocation races.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-merge-review-application.ts

    db:merge-phase-recovery:check:
        desc: Kill native merge workers before COMMIT and verify canonicalization, names and binding effects recover once.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-merge-phase-recovery.ts

    db:recommendation-build:check:
        desc: Verify native partition scoring, repeated generations, failure recovery and atomic snapshot activation.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-recommendation-build.ts

    db:recommendation-lifecycle:check:
        desc: Verify hourly retention, build deadlines, failure/backoff, admission pressure, dispatch and health.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-recommendation-lifecycle.ts

    db:recommendation-reads:check:
        desc: Verify native recommendation HTTP metadata, current visibility, cursors, tracking and private exclusions.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-recommendation-reads.ts

    db:related-posts:check:
        desc: Verify related-post context, current root disclosure, ratings, exclusions and cursor HTTP flows.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-related-post-recommendations.ts

    db:recommendation-events:check:
        desc: Verify canonical event references, current authority, races, aggregate retention and maximum HTTP batches.
        cmds:
            - test -n "${DATABASE_ADMIN_URL:-}"
            - REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log DATABASE_URL="${DATABASE_ADMIN_URL}" yarn exec tsx scripts/check-recommendation-event-intake.ts

    db:check:
        desc: Install the fresh native baseline and verify current schema and integrity contracts.
        cmds:
            - task: db:validate
            - defer: { task: db:replay:down }
            - task: db:replay:reset
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-baseline-epoch.ts preflight
            - >-
                yarn exec atlas migrate apply --env main
                --url "postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-baseline-epoch.ts installed
            - >-
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-auth-identity.ts
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1
                DATABASE_ADMIN_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-reference-values.ts
            - >-
                REZICS_DISPOSABLE_MIGRATION_FIXTURE=1 EMAIL_MODE=log
                DATABASE_URL="postgres://postgres:postgres@localhost:${POSTGRES_MIGRATION_LOCAL_PORT:-5433}/rezics_atlas?sslmode=disable"
                yarn exec tsx scripts/check-private-account-lifecycle.ts
