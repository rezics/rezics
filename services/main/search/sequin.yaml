account:
    name: "rezics"

users:
    - email: "${SEQUIN_ADMIN_EMAIL:-admin@rezics.local}"
      password: "${SEQUIN_ADMIN_PASSWORD}"

api_tokens:
    - name: "rezics-reconciler"
      token: "${SEQUIN_API_TOKEN}"

databases:
    - name: "rezics-authoritative"
      hostname: "${SEQUIN_SOURCE_HOST:-postgres}"
      port: 5432
      database: "${SEQUIN_SOURCE_DATABASE:-rezics}"
      username: "${SEQUIN_SOURCE_USERNAME:-postgres}"
      password: "${SEQUIN_SOURCE_PASSWORD}"
      pool_size: 10
      slot:
          name: "rezics_search_projection_slot"
          create_if_not_exists: true
      publication:
          name: "rezics_search_projection_publication"
          create_if_not_exists: false
      await_database:
          timeout_ms: 120000
          interval_ms: 3000

functions:
    - name: "rezics-unit-search-document-v1"
      type: "enrichment"
      file: "rezics_unit_search_document_v1.sql"
    - name: "rezics-unit-search-transform-v1"
      type: "transform"
      file: "current-transform.exs"
    - name: "rezics-unit-search-routing-v1"
      type: "routing"
      file: "current-routing.exs"
    - name: "rezics-revision-search-document-v1"
      type: "enrichment"
      file: "rezics_revision_search_document_v1.sql"
    - name: "rezics-revision-search-transform-v1"
      type: "transform"
      file: "history-transform.exs"
    - name: "rezics-revision-search-routing-v1"
      type: "routing"
      file: "history-routing.exs"

sinks:
    - name: "${MEILISEARCH_CURRENT_SINK_NAME:-rezics-units-v1-20260720}"
      database: "rezics-authoritative"
      source:
          include_tables:
              - "public.search_unit_projection_source"
      status: "active"
      actions: ["insert", "update", "delete"]
      message_grouping: true
      tables:
          - name: "public.search_unit_projection_source"
            group_column_names: ["unit_id"]
      initial_backfill: true
      enrichment: "rezics-unit-search-document-v1"
      transform: "rezics-unit-search-transform-v1"
      routing: "rezics-unit-search-routing-v1"
      load_shedding_policy: "pause_on_full"
      destination:
          type: "meilisearch"
          endpoint_url: "${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}"
          index_name: "${MEILISEARCH_CURRENT_INDEX_UID:-rezics_units_v1_20260720}"
          primary_key: "id"
          api_key: "${MEILISEARCH_CURRENT_SINK_KEY}"
          batch_size: 100
          timeout_seconds: 30
    - name: "${MEILISEARCH_HISTORY_SINK_NAME:-rezics-revisions-v1-20260720}"
      database: "rezics-authoritative"
      source:
          include_tables:
              - "public.search_revision_projection_source"
      status: "disabled"
      actions: ["insert", "update", "delete"]
      message_grouping: true
      tables:
          - name: "public.search_revision_projection_source"
            group_column_names: ["revision_id"]
      initial_backfill: true
      enrichment: "rezics-revision-search-document-v1"
      transform: "rezics-revision-search-transform-v1"
      routing: "rezics-revision-search-routing-v1"
      load_shedding_policy: "pause_on_full"
      destination:
          type: "meilisearch"
          endpoint_url: "${MEILISEARCH_INTERNAL_URL:-http://meilisearch:7700}"
          index_name: "${MEILISEARCH_HISTORY_INDEX_UID:-rezics_revisions_v1_20260720}"
          primary_key: "id"
          api_key: "${MEILISEARCH_HISTORY_SINK_KEY}"
          batch_size: 100
          timeout_seconds: 30
