# @rezics/server — main API (owns the primary schema). Aggregated as `server:*`.
# Repo-wide seed/factory live in the root Taskfile (they drive the tool/ CLI).
version: '3'

includes:
  db: ../../tool/taskfiles/drizzle.yml

tasks:
  dev:
    desc: Dev (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/index.ts
  dev:cluster:
    desc: Dev cluster entrypoint (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/cluster.ts
  build:
    desc: Compile native binary
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun --outfile server
  build:linux:
    desc: Compile linux-x64 binary (mirrors Dockerfile.server)
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile server
