# @rezics/ranking — ranking service. Aggregated as `ranking:*`.
version: '3'

includes:
  db: ../../tool/taskfiles/drizzle.yml

tasks:
  dev:
    desc: Dev (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/index.ts
  build:
    desc: Compile native binary
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun --outfile ranking
  build:linux:
    desc: Compile linux-x64 binary (mirrors docker/ranking.Dockerfile)
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile ranking
