# @rezics/api — spike API service. Aggregated by the root Taskfile as `api:*`.
version: '3'

tasks:
  dev:
    desc: Dev (watch)
    cmd: bun run --watch src/index.ts
  test:
    desc: Run tests
    cmd: bun test
  spike:book-db:
    desc: Run the book-collection DB spike
    cmd: bun run src/book/book.collection.spike.ts
