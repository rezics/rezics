# @rezics/job-runner — pg-boss worker. Aggregated as `job-runner:*`.
# Owns no schema; `db:ensure` provisions the pg-boss queue database.
version: '3'

tasks:
  dev:
    desc: Dev (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/index.ts
  build:
    desc: Compile native binary
    cmd: bun build src/index.ts --compile --minify-whitespace --minify-syntax --target bun --outfile job-runner
  build:linux:
    desc: Compile linux-x64 binary (mirrors docker/job-runner.Dockerfile)
    cmd: bun build src/index.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile job-runner
  test:
    desc: Run tests
    cmd: bun test
  typecheck:
    desc: Typecheck (tsc --noEmit)
    cmd: bun tsc --noEmit
  db:ensure:
    desc: Ensure the pg-boss queue database exists
    cmd: bun run scripts/ensure-job-db.ts
