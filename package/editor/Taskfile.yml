# @rezics/editor — Vite library. Aggregated by the root Taskfile as `editor:*`.
version: '3'

tasks:
  dev:
    desc: Watch build (Vite)
    cmd: bun vite build --watch
  build:
    desc: Production build (Vite)
    cmd: bun vite build
  test:
    desc: Run tests
    cmd: bun test
  storybook:
    desc: Storybook (port 6008)
    cmd: bun storybook dev -p 6008 --no-open {{.CLI_ARGS}}
  build-storybook:
    desc: Build the static Storybook
    cmd: bun storybook build -o storybook-static
