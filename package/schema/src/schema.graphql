type User {
    id: ID!
    name: String!
    avatar: String!
}

type Author {
    name: String!
    avatar: String!
    description: String!
}

type Book {
    id: ID!
    title: String!
    cover: String!
    author: String!
    rating: Float!
    publisher: String!
    publishDate: String!
    isbn: String!
    tags: [String!]!
    description: String!
}

type Chapter {
    id: ID!
    parentId: ID
    chapterName: String!
    noContent: Boolean!
}

type ChapterOrder {
    parentId: ID!
    childIds: [ID!]!
}

type ChapterContent {
    id: ID!
    content: String!
    createdAt: String!
    chapterName: String!
    author: User!
}

type BookList {
    id: ID!
    title: String!
    description: String!
    books: [String!]!
    creator: User!
    likes: Int!
    commentsNumber: Int!
}

type Comment {
    id: ID!
    content: String!
    createdAt: String!
    user: User!
    likes: Int!
    replies: [Comment!]
}

type Review {
    id: ID!
    content: String!
    rating: Float!
    createdAt: String!
    user: User!
}

type QuoteExcerpt {
    id: ID!
    content: String!
    createdAt: String!
    author: User!
}

type SearchBook {
    id: ID!
    title: String!
    author: String!
    description: String!
    cover: String!
}

type AuthPayload {
    token: String!
    user: User!
}

type ValidationError {
    field: String!
    message: String!
}

type Pagination {
    page: Int!
    limit: Int!
}

type PaginatedResponse {
    items: [BookList!]!
    total: Int!
    page: Int!
    limit: Int!
    totalPages: Int!
}

type Query {
    # 认证相关
    me: User
    
    # 书籍相关
    book(id: ID!): Book
    author(id: ID!): Author
    chapters(id: ID!): [Chapter!]!
    chapterOrders(bookId: ID!): [ChapterOrder!]!
    chapterContent(chapterId: ID!): ChapterContent
    quoteExcerpts(bookId: ID!): [QuoteExcerpt!]!
    
    # 书单相关
    bookLists(pagination: Pagination): PaginatedResponse
    bookList(id: ID!): BookList
    comments(bookListId: ID!): [Comment!]!
    
    # 书评相关
    bookReviews(bookId: ID!): [Review!]!
    
    # 搜索相关
    searchBooks(query: String!): [SearchBook!]!
    topBooks: [SearchBook!]!
}

type Mutation {
    # 认证相关
    login(email: String!, password: String!): AuthPayload!
    register(email: String!, password: String!): AuthPayload!
    validateEmail(email: String!): [ValidationError!]
    validatePassword(password: String!): [ValidationError!]
    
    # 书单相关
    addComment(bookListId: ID!, content: String!): Comment!
    addReply(commentId: ID!, content: String!): Comment!
    
    # 书评相关
    addReview(bookId: ID!, content: String!, rating: Float!): Review!
}