# @rezics/preview — preview service. Aggregated as `preview:*`.
version: '3'

tasks:
  dev:
    desc: Dev (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch src/index.ts
  build:
    desc: Compile native binary
    cmd: bun build src/index.ts --compile --minify-whitespace --minify-syntax --target bun --outfile preview
  build:linux:
    desc: Compile linux-x64 binary (mirrors docker/preview.Dockerfile)
    cmd: bun build src/index.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile preview
