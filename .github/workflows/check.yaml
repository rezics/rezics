name: Check

on:
    push:
        branches:
            - main
            - dev
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                  fetch-depth: 1
        
            -   name: Setup Deno
                uses: denoland/setup-deno@v2
                with:
                    deno-version: v2.x
            
            -   name: Lint
                run: deno lint
            -   name: Format
                run: deno fmt --check
            -   name: Test
                run: deno test -A
