name: Check

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                task: [format, lint, test, build]
            fail-fast: false

        name: Check (${{ matrix.task }})

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Cache Deno dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/deno
                  key: ${{ runner.os }}-deno-${{ hashFiles('**/deno.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-deno-

            - name: Run Format Check
              if: matrix.task == 'format'
              run: deno fmt --check

            - name: Run Lint
              if: matrix.task == 'lint'
              run: deno lint

            - name: Run Tests
              if: matrix.task == 'test'
              run: deno test -A

            - name: Run Build
              if: matrix.task == 'build'
              run: deno task build
