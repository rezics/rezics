# Production deploy via Nomad — manual, behind a GitHub Environment approval.
# Nomad 生产部署 — 手动触发，受 GitHub Environment 审批保护。
#
# Pulls the immutable git-SHA image tags built by build-images.yml and submits
# Nomad jobs with health-gated rolling updates. Never builds images. Rollback
# is automatic (auto_revert) or manual (nomad deployment fail).
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to deploy (git SHA already pushed to GHCR)
        required: true
      phase:
        description: Deploy phase
        required: true
        default: all
        type: choice
        options: [all, secrets, infra, configs, migrations, services, workers, backfill]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Nomad deploy (${{ inputs.phase }})
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/devenv-action@v2
      - run: bun install --frozen-lockfile

      - name: Configure SSH tunnel to Nomad
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -fN -L 4646:127.0.0.1:4646 "${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_HOST }}"

      - name: Deploy
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NOMAD_ADDR: http://127.0.0.1:4646
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: bin/nomad-deploy "${{ inputs.version }}" "${{ inputs.phase }}"
