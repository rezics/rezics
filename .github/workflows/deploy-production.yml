# Deploy backend services to Nomad on the shared rezics-A server.
# 将后端服务部署到共享 rezics-A 服务器上的 Nomad。
#
# Auto-triggers after a successful "Build and Push Images" run on main,
# or can be dispatched manually. The `production` environment can enforce
# approval gates via GitHub protection rules.
# 在 main 分支的 "Build and Push Images" 成功后自动触发，也可手动触发。
# production 环境可通过 GitHub 保护规则强制审批。
#
# The deploy performs a read-modify-write on the live Nomad job: it fetches
# the current spec, patches only the Docker image tags, and submits back.
# Environment variable changes made directly via Nomad API are preserved.
# 部署采用对线上 Nomad 任务的 read-modify-write 方式：获取当前 spec，
# 只更新 Docker 镜像标签后提交回去。通过 Nomad API 直接修改的环境变量
# 不受影响。
#
# Prerequisites / 前置条件:
# - GitHub environment "production" with secrets:
#     CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
# - Nomad job "rezics-prod" must already exist (initial deploy via nomad-pack)
# - GHCR packages must be public (Nomad pulls without auth)
name: Deploy Production

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (default: current branch HEAD)"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rezics
  NOMAD_JOB: rezics-prod
  NOMAD_URL: https://nomad.rezics.com

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Resolve deploy SHA
        id: sha
        run: |
          SHA="${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit $SHA"

      - name: Fetch current Nomad job
        run: |
          HTTP_CODE=$(curl -sw '%{http_code}' -o /tmp/job.json \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            ${{ env.NOMAD_URL }}/v1/job/${{ env.NOMAD_JOB }})
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Failed to fetch Nomad job (HTTP $HTTP_CODE). Is the job running?"
            cat /tmp/job.json
            exit 1
          fi

      - name: Update image tags
        env:
          TAG: ${{ steps.sha.outputs.tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          jq --arg prefix "$PREFIX" --arg tag "$TAG" '
            .TaskGroups |= map(
              .Tasks |= map(
                if (.Config.image // "") | startswith($prefix) then
                  .Config.image = ((.Config.image | split(":")[0]) + ":" + $tag)
                else . end
              )
            ) | { Job: . }
          ' /tmp/job.json > /tmp/deploy.json

          echo "Updated images:"
          jq -r --arg prefix "$PREFIX" \
            '.Job.TaskGroups[].Tasks[]
             | select((.Config.image // "") | startswith($prefix))
             | "  \(.Name): \(.Config.image)"' /tmp/deploy.json

      - name: Submit to Nomad
        id: nomad
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/deploy.json \
            ${{ env.NOMAD_URL }}/v1/jobs)
          EVAL_ID=$(echo "$RESPONSE" | jq -r '.EvalID')
          echo "eval_id=$EVAL_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment submitted - EvalID: $EVAL_ID"

      - name: Wait for deployment
        run: |
          EVAL_ID="${{ steps.nomad.outputs.eval_id }}"
          echo "Waiting for evaluation $EVAL_ID..."

          for i in $(seq 1 30); do
            EVAL=$(curl -sf \
              -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
              -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
              ${{ env.NOMAD_URL }}/v1/evaluation/$EVAL_ID)
            STATUS=$(echo "$EVAL" | jq -r '.Status')

            if [ "$STATUS" = "complete" ]; then
              DEPLOY_ID=$(echo "$EVAL" | jq -r '.DeploymentID')
              if [ "$DEPLOY_ID" != "null" ] && [ -n "$DEPLOY_ID" ]; then
                echo "Deployment $DEPLOY_ID started. Waiting for healthy..."
                for j in $(seq 1 60); do
                  DEPLOY=$(curl -sf \
                    -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
                    -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
                    ${{ env.NOMAD_URL }}/v1/deployment/$DEPLOY_ID)
                  DEPLOY_STATUS=$(echo "$DEPLOY" | jq -r '.Status')
                  echo "  Deployment status: $DEPLOY_STATUS (attempt $j/60)"
                  if [ "$DEPLOY_STATUS" = "successful" ]; then
                    echo "Deployment successful!"
                    exit 0
                  elif [ "$DEPLOY_STATUS" = "failed" ] || [ "$DEPLOY_STATUS" = "cancelled" ]; then
                    echo "Deployment $DEPLOY_STATUS"
                    echo "--- Per-group status ---"
                    echo "$DEPLOY" | jq -r '
                      .TaskGroups | to_entries[] |
                      "\(.key): desired=\(.value.DesiredTotal) placed=\(.value.PlacedAllocs) healthy=\(.value.HealthyAllocs) unhealthy=\(.value.UnhealthyAllocs)"'
                    echo "--- Recent allocations ---"
                    curl -sf \
                      -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
                      -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
                      "${{ env.NOMAD_URL }}/v1/job/${{ env.NOMAD_JOB }}/allocations?all=true" \
                    | jq -r '
                      sort_by(.CreateTime) | reverse | .[0:20] |
                      .[] | "\(.TaskGroup)/\(.ID[0:8]): client=\(.ClientStatus) desired=\(.DesiredStatus)"'
                    exit 1
                  fi
                  sleep 10
                done
                echo "Deployment timed out"
                exit 1
              fi
              echo "Evaluation complete (no deployment created - no changes)"
              exit 0
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "Evaluation $STATUS"
              exit 1
            fi

            echo "  Evaluation status: $STATUS (attempt $i/30)"
            sleep 5
          done
          echo "Evaluation timed out"
          exit 1

  notify:
    name: Notify
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA: ${{ needs.deploy.outputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          if [ "$DEPLOY_RESULT" = "success" ]; then
            TEXT="✅ Deploy successful — ${REPO}@${SHORT_SHA}"
          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            TEXT="⏭️ Deploy skipped — ${REPO}@${SHORT_SHA}"
          else
            TEXT="❌ Deploy failed — ${REPO}@${SHORT_SHA}"
          fi

          curl -sf -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_NOTIFIER_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="${TEXT}" || true
