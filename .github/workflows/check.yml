name: Check

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Advisory repository check
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install Nix
              uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
              with:
                  github_access_token: ${{ github.token }}

            - name: Install pinned devenv
              run: nix profile install github:cachix/devenv/55d2bb4a3cc710ba82cc8644f4419db3a802e1a4

            - name: Run advisory checks
              run: devenv shell bash deploy/scripts/run-github-check.sh
