name: Check

on:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Advisory repository check
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Restore Yarn cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.yarn/berry/cache
                  key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
                  restore-keys: |
                      yarn-${{ runner.os }}-

            - name: Install Nix
              uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
              with:
                  github_access_token: ${{ github.token }}

            - name: Enable devenv binary cache
              uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
              with:
                  name: devenv
                  skipPush: true

            - name: Install pinned devenv
              run: nix profile install github:cachix/devenv/55d2bb4a3cc710ba82cc8644f4419db3a802e1a4

            - name: Run advisory checks
              run: devenv shell bash deploy/scripts/run-github-check.sh
