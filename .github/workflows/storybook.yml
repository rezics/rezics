name: Storybook

on:
    workflow_dispatch:
    pull_request:
        paths:
            - "apps/**"
            - "libraries/**"
            - "packages/editor/**"
            - "packages/brand/**"
            - "packages/storybook/**"
            - "package.json"
            - "yarn.lock"
            - ".yarn/**"
            - ".yarnrc.yml"
            - ".github/workflows/storybook.yml"

permissions:
    contents: read

concurrency:
    group: storybook-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    components:
        name: Advisory components (${{ matrix.owner }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - owner: web
                      check: yarn run typecheck && yarn workspace @rezics/ui exec tsc --noEmit && yarn workspace @rezics/editor exec tsc --noEmit -p tsconfig.stories.json
                    - owner: rezics-text
                      check: yarn workspace @rezics/text-app exec tsc --noEmit && yarn workspace @rezics/text-web exec tsc --noEmit && yarn exec tsc --noEmit -p tsconfig.storybook.json
                    - owner: about
                      check: yarn exec astro check
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "26"
            - name: Enable pinned package manager
              run: npm install --global corepack@0.36.0 && corepack enable
            - name: Install workspace dependencies
              run: yarn install --immutable
            - name: Install browser and OS dependencies
              run: yarn workspace @rezics/frontend exec playwright install --with-deps chromium
            - name: Check owner types
              working-directory: apps/${{ matrix.owner }}
              run: ${{ matrix.check }}
            - name: Test components and accessibility with official tools
              working-directory: apps/${{ matrix.owner }}
              run: yarn exec vitest run --project storybook --reporter=default --reporter=json --outputFile=../../.temp/storybook/${{ matrix.owner }}-results.json
            - name: Build component documentation
              working-directory: apps/${{ matrix.owner }}
              run: yarn run storybook:build
            - name: Preserve test results and failure diagnostics
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: storybook-${{ matrix.owner }}
                  path: .temp/storybook/
                  include-hidden-files: true
                  retention-days: 7
