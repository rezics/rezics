# Build and deploy the static frontends to Cloudflare Pages.
# 构建静态前端并部署到 Cloudflare Pages。
#
# Auto-triggers after a successful "Build and Push Images" run on main
# (backends deploy first, so the API contract a new frontend expects
# already exists). Can also be dispatched manually to redeploy or to
# deploy a single frontend.
# 在 main 分支的 "Build and Push Images" 成功后自动触发（后端先部署，
# 前端所需的 API 契约已就绪）。也可手动触发以重新部署或选择性部署。
name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which frontend(s) to deploy
        required: true
        default: both
        type: choice
        options: [both, app, admin]

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Build & deploy
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        app: [app, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile

      - name: Skip unselected app
        if: github.event_name == 'workflow_dispatch'
        id: gate
        run: |
          if [ "${{ inputs.target }}" != "both" ] && \
             [ "${{ inputs.target }}" != "${{ matrix.app }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.app }}
        if: steps.gate.outputs.skip != 'true'
        run: task ${{ matrix.app }}:build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_NOTIFY_BASE_URL: ${{ vars.VITE_NOTIFY_BASE_URL }}
          VITE_REACTION_SERVICE_URL: ${{ vars.VITE_REACTION_SERVICE_URL }}
          VITE_AUTH_ADMIN_URL: ${{ vars.VITE_AUTH_ADMIN_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy ${{ matrix.app }} to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: package/${{ matrix.app }}
          command: pages deploy dist --project-name=rezics-${{ matrix.app }}
