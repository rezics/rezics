# Run Claude Code as a GitHub Agent triggered by @claude mentions or issue assignment.
# 通过 @claude 提及或 issue 分配触发 Claude Code 作为 GitHub Agent 运行。
#
# Uses devenv to provide the full project toolchain (bun, go-task, postgresql, etc.)
# so the agent operates in the same environment as local development.
# 使用 devenv 提供完整的项目工具链（bun、go-task、postgresql 等），
# 使 agent 与本地开发环境一致。
#
# Prerequisites / 前置条件:
# - Install the Claude GitHub App: https://github.com/apps/claude
#   安装 Claude GitHub App：https://github.com/apps/claude
# - Repository secret: ANTHROPIC_API_KEY
name: Claude Agent

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent:
    # Skip the expensive devenv build unless Claude is actually triggered.
    # 跳过昂贵的 devenv 构建，除非确实触发了 Claude。
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nix + devenv: full project toolchain (bun, go-task, postgresql, jq, etc.)
      # Nix + devenv：完整项目工具链（bun、go-task、postgresql、jq 等）
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: accept-flake-config = true

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Install devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Build devenv environment
        run: |
          devenv ci
          echo "$PWD/.devenv/profile/bin" >> $GITHUB_PATH

      # Project dependencies / 项目依赖
      - run: yarn install --immutable
      - run: cd tool && bun install --frozen-lockfile

      # Claude Code agent
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          assignee_trigger: "claude"
