# Build and publish backend production images to GHCR.
#
# Triggered manually. Produces immutable git-SHA-tagged images for every
# package-owned backend runtime service, plus the build-stage "migrate" images
# used by one-shot migration jobs. Deploy is a SEPARATE, manually-approved
# workflow (deploy-production.yml) that pulls these tags.
name: Build Images

on:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rezics

jobs:
  # Repo checks + targeted backend builds gate image publishing (task 7.1).
  verify:
    name: Checks & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: task check:convention
      - run: task check:i18n
      - run: task knip
      - name: Targeted tests
        run: task test

  images:
    name: Build & Push (${{ github.sha }})
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The shared base bakes the installed Bun workspace; each thin per-service
      # Dockerfile is `FROM rezics-base:dev`, so build it locally first.
      - name: Build shared base
        run: docker build -f docker/base.Dockerfile -t rezics-base:dev .

      # Runtime images for every backend service.
      - name: Build & push runtime images
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for svc in server auth notify reaction history ranking preview job-runner; do
            img="${IMAGE_PREFIX}-${svc}"
            docker build -f "docker/${svc}.Dockerfile" \
              -t "${img}:${SHA}" -t "${img}:dev" .
            docker push "${img}:${SHA}"
            docker push "${img}:dev"
          done

      # Build-stage "migrate" images (carry Bun + Drizzle Kit + migrations) for
      # the one-shot migration jobs. Slim runtime images cannot run migrations.
      - name: Build & push migrate images
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          for svc in server auth notify reaction history ranking job-runner; do
            img="${IMAGE_PREFIX}-${svc}-migrate"
            docker build -f "docker/${svc}.Dockerfile" --target build \
              -t "${img}:${SHA}" .
            docker push "${img}:${SHA}"
          done
