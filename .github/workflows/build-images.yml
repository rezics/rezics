# Build and push backend Docker images to GHCR on every push.
# 每次 push 自动构建后端 Docker 镜像并推送到 GHCR。
#
# Produces immutable sha-tagged images for every backend service, plus
# build-stage "migrate" images for one-shot migration jobs. Deploy is a
# SEPARATE workflow (deploy-production.yml) auto-triggered on completion.
# 每个后端服务生成不可变的 sha 标签镜像以及构建阶段的 migrate 镜像。
# 部署由 deploy-production.yml 在构建完成后自动触发。
name: Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rezics

jobs:
  verify:
    name: Checks & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: cd tool && bun install --frozen-lockfile
      - name: Check convention
        run: task check:convention
      - name: Check i18n
        run: task check:i18n
      - name: Check unused exports & dependencies
        run: task knip
        continue-on-error: true
      - name: Check env isolation
        run: task check:runtime-env
        continue-on-error: true

  base:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-base:latest
            ${{ env.IMAGE_PREFIX }}-base:sha-${{ github.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base,ignore-error=true

  images:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: server
            migrate: true
          - service: auth
            migrate: true
          - service: notify
            migrate: true
          - service: reaction
            migrate: true
          - service: history
            migrate: true
          - service: ranking
            migrate: true
          - service: preview
            migrate: false
          - service: job-runner
            migrate: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

      - name: Build & push migrate image
        if: matrix.migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          target: build
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-migrate:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}-migrate:sha-${{ github.sha }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
