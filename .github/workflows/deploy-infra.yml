# Infrastructure changes via Nomad — a SEPARATE, manually-approved target from
# app deploys. Runs/restarts the self-hosted infrastructure jobs (postgres,
# meilisearch, sequin, otel-collector). Kept apart from deploy-production.yml
# because infra changes are higher-risk and not part of a routine app rollout.
# 基础设施 Nomad 作业 — 独立于应用部署，手动触发，高风险变更单独审批。
name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      job:
        description: Infrastructure job to run
        required: true
        type: choice
        options:
          - infra-postgres
          - infra-meilisearch
          - infra-sequin
          - infra-otel
      action:
        description: Action
        required: true
        default: run
        type: choice
        options: [run, stop]

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  infra:
    name: ${{ inputs.action }} ${{ inputs.job }}
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/devenv-action@v2

      - name: Configure SSH tunnel to Nomad
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -fN -L 4646:127.0.0.1:4646 "${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_HOST }}"

      - name: Sync infrastructure secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          NOMAD_ADDR: http://127.0.0.1:4646
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: bin/nomad-sync-secrets infra

      - name: Run infrastructure action
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          if [ "${{ inputs.action }}" = "stop" ]; then
            nomad job stop "${{ inputs.job }}"
          else
            nomad job run "nomad/jobs/${{ inputs.job }}.nomad.hcl"
          fi
