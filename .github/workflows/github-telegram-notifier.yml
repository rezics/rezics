name: Github Telegram Notifier

on:
    push:
        branches:
            - "**"

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Send Telegram Notification
              uses: EverythingSuckz/github-telegram-notify@v1.1.2
              with:
                  bot_token: ${{ secrets.TG_NOTIFIER_BOT_TOKEN }}
                  chat_id: ${{ secrets.TG_CHAT_ID }}
