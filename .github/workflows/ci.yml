name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: bun install --frozen-lockfile
      - run: cd tool && bun install --frozen-lockfile

      - name: Check convention (routes & folders)
        run: task check:convention

      - name: Check i18n keys & namespaces
        run: task check:i18n

      - name: Check unused exports & dependencies
        run: task knip
        continue-on-error: true

      - name: Check env isolation
        run: task check:runtime-env
