name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── Build Stage (parallel) ────────────────────────────

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Write app .env.production
        run: |
          cat > package/app/.env.production <<EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }}
          VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          EOF

      - name: Write admin .env.production
        run: |
          cat > package/admin/.env.production <<EOF
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }}
          EOF

      - name: Build app
        run: cd package/app && bun run build

      - name: Build admin
        run: cd package/admin && bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: package/app/dist/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-admin
          path: package/admin/dist/
          retention-days: 3

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: cd package/server && bunx prisma generate

      - name: Compile server binary
        run: cd package/server && bun run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: package/server/server
          retention-days: 3

  build-auth:
    name: Build Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: cd package/auth && bunx prisma generate

      - name: Compile auth binary
        run: cd package/auth && bun run build:linux

      - uses: actions/upload-artifact@v4
        with:
          name: auth-binary
          path: package/auth/server
          retention-days: 3

  # ── Deploy Stage (sequential) ─────────────────────────

  deploy:
    name: Deploy to VPS
    needs: [build-frontend, build-server, build-auth]
    runs-on: ubuntu-latest
    env:
      SSH_ARGS: -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }}
      RSYNC_SSH: ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }}
      VPS: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SERVER_DIR: /www/wwwroot/Library.Book/server
      AUTH_DIR: /www/wwwroot/Library.Book/auth
      APP_DIR: /opt/1panel/www/sites/book.rezics.com/index
      ADMIN_DIR: /opt/1panel/www/sites/admin.rezics.com/index
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: artifacts/app-dist/

      - uses: actions/download-artifact@v4
        with:
          name: frontend-admin
          path: artifacts/admin-dist/

      - uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: artifacts/server/

      - uses: actions/download-artifact@v4
        with:
          name: auth-binary
          path: artifacts/auth/

      # ── SSH Setup ───────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # ── Ensure VPS directories exist ────────────────
      - name: Prepare VPS directories
        run: |
          ssh $SSH_ARGS $VPS "
            sudo mkdir -p $SERVER_DIR $AUTH_DIR $APP_DIR $ADMIN_DIR
            sudo chown www:www $SERVER_DIR $AUTH_DIR
          "

      # ── Service Self-Healing ────────────────────────
      - name: Ensure systemd services exist
        run: |
          rsync -avz -e "$RSYNC_SSH" \
            tool/install-services/rezbooklib.service \
            tool/install-services/rezbookauth.service \
            $VPS:/tmp/deploy-services/

          ssh $SSH_ARGS $VPS '
            for svc in rezbooklib rezbookauth; do
              if ! systemctl list-unit-files | grep -q "${svc}.service"; then
                echo "Installing ${svc}.service..."
                sudo cp /tmp/deploy-services/${svc}.service /etc/systemd/system/
                sudo chmod 644 /etc/systemd/system/${svc}.service
                sudo systemctl daemon-reload
                sudo systemctl enable ${svc}.service
              fi
            done
            rm -rf /tmp/deploy-services
          '

      # ── 1. Database Migrations ─────────────────────
      - name: Run Prisma migrations (server)
        run: |
          rsync -avz -e "$RSYNC_SSH" \
            package/server/prisma/ \
            $VPS:/tmp/deploy-prisma/server/

          ssh $SSH_ARGS $VPS "
            cd $SERVER_DIR
            set -a; source .env.production 2>/dev/null; set +a
            cd /tmp/deploy-prisma/server
            bunx prisma migrate deploy
          "

      - name: Run Prisma migrations (auth)
        run: |
          rsync -avz -e "$RSYNC_SSH" \
            package/auth/prisma/ \
            $VPS:/tmp/deploy-prisma/auth/

          ssh $SSH_ARGS $VPS "
            cd $AUTH_DIR
            set -a; source .env.production 2>/dev/null; set +a
            cd /tmp/deploy-prisma/auth
            bunx prisma migrate deploy
          "

      - name: Run server custom SQL migrations
        run: |
          ssh $SSH_ARGS $VPS "
            cd $SERVER_DIR
            set -a; source .env.production 2>/dev/null; set +a
            cd /tmp/deploy-prisma/server
            bun run db/index.ts
          "

      - name: Clean up migration files
        run: ssh $SSH_ARGS $VPS "rm -rf /tmp/deploy-prisma"

      # ── 2. Deploy Frontend ─────────────────────────
      - name: Deploy app frontend
        run: |
          rsync -avz --delete -e "$RSYNC_SSH" \
            artifacts/app-dist/ $VPS:$APP_DIR/

      - name: Deploy admin frontend
        run: |
          rsync -avz --delete -e "$RSYNC_SSH" \
            artifacts/admin-dist/ $VPS:$ADMIN_DIR/

      # ── 3. Deploy Server Binary ────────────────────
      - name: Deploy server
        run: |
          chmod +x artifacts/server/server
          ssh $SSH_ARGS $VPS "
            [ -f $SERVER_DIR/server ] && cp $SERVER_DIR/server $SERVER_DIR/server.bak
            sudo systemctl stop rezbooklib.service || true
          "
          rsync -avz -e "$RSYNC_SSH" \
            artifacts/server/server $VPS:$SERVER_DIR/server
          ssh $SSH_ARGS $VPS "sudo systemctl start rezbooklib.service"

      # ── 4. Deploy Auth Binary ──────────────────────
      - name: Deploy auth
        run: |
          chmod +x artifacts/auth/server
          ssh $SSH_ARGS $VPS "
            [ -f $AUTH_DIR/server ] && cp $AUTH_DIR/server $AUTH_DIR/server.bak
            sudo systemctl stop rezbookauth.service || true
          "
          rsync -avz -e "$RSYNC_SSH" \
            artifacts/auth/server $VPS:$AUTH_DIR/server
          ssh $SSH_ARGS $VPS "sudo systemctl start rezbookauth.service"

      # ── 5. Health Check ────────────────────────────
      - name: Verify services
        run: |
          sleep 5
          ssh $SSH_ARGS $VPS "
            echo '=== Service Status ==='
            systemctl is-active rezbooklib.service
            systemctl is-active rezbookauth.service
            echo '=== All services healthy ==='
          "
