name: Release

on:
    push:
        tags:
            - "v*.*.*"

concurrency:
    group: production
    cancel-in-progress: false

permissions:
    contents: write
    id-token: write

jobs:
    release:
        name: Dispatch server release
        # v1.0.0 is reissued by the explicitly authorized manual deployment;
        # moving that tag must not dispatch a second CI server deployment.
        if: github.ref_name != 'v1.0.0'
        runs-on: ubuntu-latest
        environment: production
        # The controller's bounded component stages add up to just under six
        # hours; keep the CI job alive until Nomad reports the terminal state.
        timeout-minutes: 360
        steps:
            - name: Checkout release metadata
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Verify released migration history
              run: bash deploy/scripts/check-released-migration-history.sh

            - name: Dispatch immutable tag
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  GATEWAY_URL: https://deploy.rezics.com/v1/releases/dispatch
                  # Reuse the existing Cloudflare ingress path; the gateway
                  # separates dispatch POSTs from timeline GETs.
                  TIMELINE_URL: https://deploy.rezics.com/v1/releases/dispatch
                  OIDC_AUDIENCE: rezics-nomad-release
              run: |
                  set -euo pipefail
                  umask 077

                  oidc_response="$(
                      curl --fail --silent --show-error \
                          --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"
                  )"
                  oidc_token="$(jq -er '.value' <<<"${oidc_response}")"
                  unset oidc_response

                  dispatch_response="${RUNNER_TEMP}/rezics-release-dispatch.json"
                  http_status="$(curl --silent --show-error \
                      --connect-timeout 15 \
                      --max-time 60 \
                      --request POST \
                      --header "Authorization: Bearer ${oidc_token}" \
                      --header "Accept: application/json" \
                      --output "${dispatch_response}" \
                      --write-out '%{http_code}' \
                      "${GATEWAY_URL}")"
                  unset oidc_token

                  if [[ "${http_status}" != 202 ]]; then
                      printf 'Release gateway returned HTTP %s: ' "${http_status}" >&2
                      jq -r '.error // "unstructured response"' "${dispatch_response}" >&2 || true
                      exit 1
                  fi
                  jq -e \
                      --arg ref "${GITHUB_REF}" \
                      --arg sha "${GITHUB_SHA}" \
                      '.status == "accepted" and .ref == $ref and .sha == $sha and
                       (.job_id | type == "string" and length > 0) and
                       (.eval_id | type == "string" and length > 0)' \
                      "${dispatch_response}" >/dev/null
                  jq '{status, job_id, eval_id, ref, sha}' "${dispatch_response}"

                  job_id="$(jq -er '.job_id' "${dispatch_response}")"
                  eval_id="$(jq -er '.eval_id' "${dispatch_response}")"
                  bash deploy/scripts/follow-nomad-release.sh \
                      "${TIMELINE_URL}" "${job_id}" "${eval_id}" "${OIDC_AUDIENCE}"

                  if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
                      release_notes="docs/releases/${GITHUB_REF_NAME#v}.md"
                      release_args=(
                          "${GITHUB_REF_NAME}"
                          --verify-tag
                          --title "REZICS ${GITHUB_REF_NAME}"
                      )
                      if [[ -f "${release_notes}" ]]; then
                          release_args+=(--notes-file "${release_notes}")
                      else
                          release_args+=(--generate-notes)
                      fi
                      gh release create "${release_args[@]}"
                  fi
