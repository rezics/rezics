version: "3"

tasks:
    generate:icons:
        desc: Generate Tauri platform icons from app-icon.svg.
        cmds:
            - yarn exec tauri icon ./app-icon.svg
        status:
            - test src-tauri/icons/32x32.png -nt app-icon.svg
            - test src-tauri/icons/128x128.png -nt app-icon.svg
            - test src-tauri/icons/128x128@2x.png -nt app-icon.svg
            - test src-tauri/icons/icon.icns -nt app-icon.svg
            - test src-tauri/icons/icon.ico -nt app-icon.svg

    dev:
        desc: Run the local REZICS Text desktop application.
        cmds:
            - task: generate:icons
            - yarn exec tauri dev

    dev:web:
        desc: Run the independently accessible Web editor service.
        cmds:
            - yarn workspace @rezics/text-web exec vite

    typecheck:
        desc: Type-check the REZICS Text application packages.
        cmds:
            - yarn workspace @rezics/text-app exec tsc --noEmit
            - yarn workspace @rezics/text-web exec tsc --noEmit
            - yarn exec tsc --noEmit -p tsconfig.storybook.json

    test:
        desc: Run REZICS Text application behavior tests.
        cmds:
            - yarn workspace @rezics/text-app exec vitest run
            - yarn workspace @rezics/text-web exec vitest run
            - task: rust:test

    check:
        desc: Check TypeScript and Rust desktop boundaries.
        cmds:
            - task: typecheck
            - task: rust:check

    rust:check:
        desc: Type-check the REZICS Text desktop Rust crate.
        deps:
            - generate:icons
        cmds:
            - cargo check --manifest-path src-tauri/Cargo.toml

    rust:format:
        desc: Format the REZICS Text desktop Rust sources with rustfmt.
        cmds:
            - cargo fmt --manifest-path src-tauri/Cargo.toml --all

    rust:format:check:
        desc: Check the REZICS Text desktop Rust sources with rustfmt.
        cmds:
            - cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

    rust:test:
        desc: Run REZICS Text desktop Rust tests.
        deps:
            - generate:icons
        cmds:
            - cargo test --manifest-path src-tauri/Cargo.toml

    build:web:
        desc: Build the standalone Web editor service.
        cmds:
            - yarn workspace @rezics/text-web exec vite build

    build:
        desc: Build the Tauri desktop application bundle.
        cmds:
            - task: generate:icons
            - node scripts/build-desktop.mjs

    storybook:
        desc: Start the isolated rezics-text component runtime.
        cmds:
            - yarn run storybook {{.CLI_ARGS}}

    storybook:build:
        desc: Build this owner's component documentation.
        cmds:
            - yarn run storybook:build

    storybook:tools:
        desc: Invoke official discovery, docs, testing and review tools.
        cmds:
            - yarn exec storybook tools {{.CLI_ARGS}}

    storybook:test:
        desc: Run component and accessibility checks with the official Vitest integration.
        cmds:
            - yarn exec vitest run --project storybook {{.CLI_ARGS}}

    storybook:capture:
        desc: Capture selected stories with the native browser API for AI inspection.
        preconditions:
            - sh: '{{if contains ".stories." .CLI_ARGS}}true{{else}}false{{end}}'
              msg: Pass story file filters; screenshot capture requires an explicit selection.
        env:
            STORYBOOK_CAPTURE: "true"
        cmds:
            - yarn exec vitest run --config vitest.config.ts {{.CLI_ARGS}}

    storybook:coverage:
        desc: Report native browser coverage for this owner.
        cmds:
            - yarn exec vitest run --config vitest.config.ts --coverage {{.CLI_ARGS}}
