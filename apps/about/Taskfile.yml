# @rezics/about — Astro static site. Aggregated by the root Taskfile as apps-about:*.
version: "3"

env:
    ASTRO_TELEMETRY_DISABLED: "1"

tasks:
    dev:
        desc: Start the Astro development server.
        cmds:
            - yarn exec astro dev --host 0.0.0.0 --port 4174

    build:
        desc: Build the prerendered Astro site.
        cmds:
            - yarn exec astro build

    preview:
        desc: Preview the built Astro site.
        cmds:
            - yarn exec astro preview --host 0.0.0.0 --port 4174

    check:
        desc: Run Astro and TypeScript checks.
        cmds:
            - yarn exec astro check

    test:
        desc: Run about-site behavior tests.
        cmds:
            - yarn exec vitest run --config vitest.unit.config.ts

    test:dist:
        desc: Verify the prerendered output.
        cmds:
            - yarn exec tsx scripts/verify-build.ts

    storybook:
        desc: Start the isolated about component runtime.
        cmds:
            - yarn run storybook {{.CLI_ARGS}}

    storybook:build:
        desc: Build this owner's component documentation.
        cmds:
            - yarn run storybook:build

    storybook:tools:
        desc: Invoke official discovery, docs, testing and review tools.
        cmds:
            - yarn exec storybook tools {{.CLI_ARGS}}

    storybook:test:
        desc: Run component and accessibility checks with the official Vitest integration.
        cmds:
            - yarn exec vitest run --project storybook {{.CLI_ARGS}}

    storybook:capture:
        desc: Capture selected stories with the native browser API for AI inspection.
        preconditions:
            - sh: '{{if contains ".stories." .CLI_ARGS}}true{{else}}false{{end}}'
              msg: Pass story file filters; screenshot capture requires an explicit selection.
        env:
            STORYBOOK_CAPTURE: "true"
        cmds:
            - yarn exec vitest run --config vitest.config.ts {{.CLI_ARGS}}

    storybook:coverage:
        desc: Report native browser coverage for this owner.
        cmds:
            - yarn exec vitest run --config vitest.config.ts --coverage {{.CLI_ARGS}}
