# @rezics/about — Vike/React site. Aggregated by the root Taskfile as about:*.
version: "3"

tasks:
    dev:
        desc: Start the Vike development server.
        cmds:
            - yarn exec vike dev --host 0.0.0.0 --port 4174

    build:
        desc: Build the prerendered Vike site.
        cmds:
            - yarn run build

    preview:
        desc: Preview the built Vike site.
        cmds:
            - yarn exec vike preview --host 0.0.0.0 --port 4174

    check:
        desc: Run TypeScript checks.
        cmds:
            - yarn exec tsc --noEmit

    test:
        desc: Run about-site behavior tests.
        cmds:
            - yarn exec vitest run --config vitest.config.ts

    test:dist:
        desc: Verify the prerendered output.
        cmds:
            - yarn exec vitest run --config vitest.dist.config.ts
