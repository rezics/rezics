version: "3"

tasks:
    dev:
        desc: Start the frontend development server.
        cmds:
            - PORT="${FRONTEND_PORT:-3000}" yarn run dev

    build:
        desc: Create the frontend production build.
        cmds:
            - yarn run generate:offline
            - yarn run build

    cloudflare:typegen:
        desc: Regenerate Cloudflare Worker environment types from wrangler.jsonc.
        cmds:
            - yarn run typegen:cloudflare

    cloudflare:typegen:check:
        desc: Verify the committed Cloudflare Worker types match wrangler.jsonc.
        cmds:
            - yarn run typegen:cloudflare:check

    cloudflare:deploy:
        desc: Build and deploy the production Vinext Worker.
        cmds:
            - yarn run generate:offline
            - yarn run deploy:cloudflare

    offline:check:
        desc: Verify the committed offline page matches its formatted generated output.
        cmds:
            - yarn run generate:offline:check

    typecheck:
        desc: Type-check the frontend.
        cmds:
            - yarn run typecheck

    test:
        desc: Run frontend behavior tests.
        dir: ../..
        cmds:
            - yarn exec vitest run --project web
