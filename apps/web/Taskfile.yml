version: "3"

tasks:
    storybook:
        desc: Start the Storybook component and agent runtime.
        cmds:
            - yarn run storybook {{.CLI_ARGS}}

    storybook:build:
        desc: Build the static component documentation and preview.
        cmds:
            - yarn run storybook:build

    storybook:test:
        desc: Run component and accessibility checks with the official Vitest integration.
        cmds:
            - yarn exec vitest run --project storybook {{.CLI_ARGS}}

    storybook:tools:
        desc: Invoke official Storybook discovery, docs, test, preview, and review tools.
        cmds:
            - yarn exec storybook tools {{.CLI_ARGS}}

    storybook:skills:
        desc: Read the installed Storybook version's agent workflow.
        cmds:
            - yarn exec storybook skills {{.CLI_ARGS}}

    storybook:browsers:
        desc: Install Chromium for the native Vitest Browser provider.
        cmds:
            - yarn exec playwright install chromium

    storybook:coverage:
        desc: Run the Storybook browser project with native coverage reporting.
        cmds:
            - yarn exec vitest run --project storybook --coverage {{.CLI_ARGS}}

    storybook:capture:
        desc: Capture selected stories with the native browser API for AI inspection.
        preconditions:
            - sh: '{{if contains ".stories." .CLI_ARGS}}true{{else}}false{{end}}'
              msg: Pass story file filters; screenshot capture requires an explicit selection.
        env:
            STORYBOOK_CAPTURE: "true"
        cmds:
            - yarn exec vitest run --project storybook {{.CLI_ARGS}}

    dev:
        desc: Start the frontend development server.
        cmds:
            - PORT="${FRONTEND_PORT:-3000}" yarn run dev

    build:
        desc: Create the frontend production build.
        cmds:
            - yarn run generate:offline
            - yarn run build

    cloudflare:typegen:
        desc: Regenerate Cloudflare Worker environment types from wrangler.jsonc.
        cmds:
            - yarn run typegen:cloudflare

    cloudflare:typegen:check:
        desc: Verify the committed Cloudflare Worker types match wrangler.jsonc.
        cmds:
            - yarn run typegen:cloudflare:check

    cloudflare:deploy:
        desc: Build and deploy the production Vinext Worker.
        cmds:
            - yarn run generate:offline
            - yarn run deploy:cloudflare

    offline:check:
        desc: Verify the committed offline page matches its formatted generated output.
        cmds:
            - yarn run generate:offline:check

    typecheck:
        desc: Type-check the frontend.
        cmds:
            - yarn run typecheck

    test:
        desc: Run frontend behavior tests.
        dir: ../..
        cmds:
            - yarn exec vitest run --project web
