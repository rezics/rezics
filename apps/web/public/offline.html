<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<title></title>
		<style>
		:root {
			font-family: Inter, ui-sans-serif, system-ui, sans-serif;
			color: #181c1f;
			background: #ffffff;
		}
		:root:lang(zh-Hans) {
			font-family:
				Inter, "Noto Sans CJK SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
		}
		:root:lang(zh-Hant) {
			font-family:
				Inter, "Noto Sans CJK TC", "Microsoft JhengHei", ui-sans-serif, system-ui,
				sans-serif;
		}
		:root:lang(ja) {
			font-family:
				Inter, "Noto Sans CJK JP", "Yu Gothic", ui-sans-serif, system-ui, sans-serif;
		}
		:root:lang(ko) {
			font-family:
				Inter, "Noto Sans CJK KR", "Malgun Gothic", ui-sans-serif, system-ui, sans-serif;
		}
		body {
			min-height: 100svh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
				max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
			box-sizing: border-box;
		}
		main {
			width: min(100%, 28rem);
			text-align: center;
		}
		img {
			width: 5rem;
			height: 5rem;
			border-radius: 0.75rem;
		}
		h1 {
			margin: 1.5rem 0 0.5rem;
			font-size: 1.5rem;
			font-family: ui-serif, serif;
		}
		p {
			margin: 0;
			color: #5c6c74;
			line-height: 1.65;
		}
		a {
			display: inline-flex;
			margin-top: 1.5rem;
			padding: 0.65rem 1rem;
			border-radius: 0.5rem;
			color: #000000;
			background: #d8404c;
			font-weight: 650;
			text-decoration: none;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				color: #eef1f3;
				background: #0e1113;
			}
			p {
				color: #8ba2ad;
			}
		}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/pwa-192x192.png" alt="" />
			<h1 id="heading"></h1>
			<p id="description"></p>
			<a href="/" id="retry"></a>
		</main>
		<script>
		const messages = {
			de: {
				title: "Offline",
				heading: "Du bist offline",
				description: "Stelle die Verbindung wieder her, um weiterzusuchen.",
				retry: "Erneut versuchen",
			},
			en: {
				title: "Offline",
				heading: "You’re offline",
				description: "Reconnect to continue browsing.",
				retry: "Retry",
			},
			es: {
				title: "Sin conexión",
				heading: "Estás sin conexión",
				description: "Vuelve a conectarte para continuar navegando.",
				retry: "Reintentar",
			},
			fr: {
				title: "Hors connexion",
				heading: "Vous êtes hors connexion",
				description: "Rétablissez la connexion pour poursuivre votre navigation.",
				retry: "Réessayer",
			},
			ja: {
				title: "オフライン",
				heading: "現在オフラインです",
				description: "再接続すると閲覧を続けられます。",
				retry: "再試行",
			},
			ko: {
				title: "오프라인",
				heading: "현재 오프라인 상태입니다",
				description: "다시 연결하면 계속 탐색할 수 있습니다.",
				retry: "재시도",
			},
			"zh-Hans": {
				title: "离线",
				heading: "当前处于离线状态",
				description: "重新连接后即可继续浏览。",
				retry: "重试",
			},
			"zh-Hant": {
				title: "離線",
				heading: "目前處於離線狀態",
				description: "重新連線後即可繼續瀏覽。",
				retry: "重試",
			},
		};
		const requested = [...(navigator.languages || []), navigator.language || ""];
		const match =
			requested
				.map((value) => {
					try {
						const locale = new Intl.Locale(value.replaceAll("_", "-"));
						if (locale.language === "zh") {
							if (
								locale.script === "Hant" ||
								["TW", "HK", "MO"].includes(locale.region)
							)
								return "zh-Hant";
							if (locale.script === "Hans" || ["CN", "SG"].includes(locale.region))
								return "zh-Hans";
							return "zh-Hant";
						}
						return Object.hasOwn(messages, locale.language)
							? locale.language
							: undefined;
					} catch {
						return undefined;
					}
				})
				.find(Boolean) || "zh-Hant";
		const copy = messages[match];
		document.documentElement.lang = match;
		document.title = copy.title + " · " + "REZICS";
		document.getElementById("heading").textContent = copy.heading;
		document.getElementById("description").textContent = copy.description;
		document.getElementById("retry").textContent = copy.retry;
		</script>
	</body>
</html>
