<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#07131F" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<title>离线 · REZICS</title>
		<style>
			:root {
				font-family: Inter, "Noto Sans CJK SC", ui-sans-serif, system-ui, sans-serif;
				color: #18222b;
				background: #f7f4ee;
			}
			body {
				min-height: 100svh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: max(1.5rem, env(safe-area-inset-top))
					max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom))
					max(1.5rem, env(safe-area-inset-left));
				box-sizing: border-box;
			}
			main {
				width: min(100%, 28rem);
				text-align: center;
			}
			img {
				width: 5rem;
				height: 5rem;
				border-radius: 0.75rem;
			}
			h1 {
				margin: 1.5rem 0 0.5rem;
				font-size: 1.5rem;
				font-family: "Noto Serif CJK SC", "Songti SC", ui-serif, serif;
			}
			p {
				margin: 0;
				color: #5b6470;
				line-height: 1.65;
			}
			a {
				display: inline-flex;
				margin-top: 1.5rem;
				padding: 0.65rem 1rem;
				border-radius: 0.5rem;
				color: #ffffff;
				background: #996314;
				font-weight: 650;
				text-decoration: none;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color: #f1e4cc;
					background: #07131f;
				}
				p {
					color: #b8b0a1;
				}
				a {
					color: #1b1408;
					background: #d8a050;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/pwa-192x192.png" alt="" />
			<h1>当前处于离线状态</h1>
			<p>重新连接后即可继续访问。<br />You’re offline. Reconnect to continue.</p>
			<a href="/">重试 · Retry</a>
		</main>
	</body>
</html>
