receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/clickstack:
    endpoint: ${env:CLICKSTACK_OTLP_ENDPOINT}
    headers:
      authorization: ${env:CLICKSTACK_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/clickstack]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/clickstack]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/clickstack]
