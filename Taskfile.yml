version: "3"

dotenv:
    - .env
    - .env.example

includes:
    services-main:
        taskfile: ./services/main/Taskfile.yml
        dir: ./services/main
    apps-web:
        taskfile: ./apps/web/Taskfile.yml
        dir: ./apps/web
    apps-about:
        taskfile: ./apps/about/Taskfile.yml
        dir: ./apps/about
    libraries:
        taskfile: ./libraries/Taskfile.yml
        dir: ./libraries
    aspire-apphost:
        taskfile: ./aspire-apphost/Taskfile.yml
        dir: ./aspire-apphost
    packages-api:
        taskfile: ./packages/api/Taskfile.yml
        dir: ./packages/api

tasks:
    format:
        desc: Format source files with Prettier.
        cmds:
            - yarn exec prettier . --write

    format:check:
        desc: Check source formatting with Prettier.
        cmds:
            - yarn exec prettier . --check

    scc:
        desc: Count source code without generated outputs.
        cmds:
            - >-
                scc --no-gen
                --exclude-dir dist
                --exclude-dir generated
                --exclude-dir migrations
                --exclude-file next-env.d.ts
                --exclude-file openapi.json

    typecheck:
        desc: Type-check every application, service, and library workspace.
        cmds:
            - task: aspire-apphost:typecheck
            - task: services-main:typecheck
            - task: apps-web:typecheck
            - task: apps-about:check
            - task: libraries:typecheck
            - task: packages-api:typecheck

    test:
        desc: Run behavior tests for every application and service workspace.
        cmds:
            - task: libraries:access:test
            - task: libraries:avatar:test
            - task: libraries:portable-text:test
            - task: libraries:license:test
            - task: libraries:i18n:test
            - task: libraries:email:test
            - task: libraries:fixture-data:test
            - task: services-main:test
            - task: apps-web:test
            - task: apps-about:test
            - task: packages-api:test

    test:coverage:
        desc: Generate a local behavior-test coverage report without enforcing thresholds.
        cmds:
            - yarn exec vitest run --coverage

    db:check:
        desc: Replay main-service migrations and verify schema synchronization.
        cmds:
            - task: services-main:db:check

    openapi:generate:
        desc: Generate the OpenAPI document and Fetch SDK.
        cmds:
            - task: libraries:generate
            - task: packages-api:generate

    openapi:check:
        desc: Verify committed OpenAPI and SDK outputs are current.
        cmds:
            - task: openapi:generate
            - git diff --exit-code -- libraries/services/main/openapi/openapi.json libraries/services/main/openapi-fetch/src/generated libraries/services/main/openapi-tanstack-query/src/generated packages/api/src/generated
            - test -z "$(git ls-files --others --exclude-standard -- libraries/services/main/openapi/openapi.json libraries/services/main/openapi-fetch/src/generated libraries/services/main/openapi-tanstack-query/src/generated packages/api/src/generated)"

    seed:contract:
        desc: Verify fresh platform installation, coverage Seed, derived projections, and official Zone Search.
        cmds:
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes
            - task: services-main:platform:installation:check
            - task: services-main:db:seed
              vars:
                  CLI_ARGS: --profile coverage
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      prepare --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: infra:search:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      rebuild-local --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}} --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      reconcile --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      promote --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:db:seed:search:check

    infra:start:
        desc: Start persistent databases, object storage, Meilisearch, and Sequin state services.
        cmds:
            - docker compose up -d --wait postgres rustfs meilisearch sequin-postgres sequin-redis

    infra:up:
        desc: Start persistent infrastructure and idempotently initialize object storage.
        cmds:
            - task: infra:start
            - task: services-main:storage:prepare

    infra:up:search:
        desc: Alias for the default search-capable infrastructure graph.
        cmds:
            - task: infra:up

    infra:search:start:
        desc: Start the existing Sequin container without forcing a configuration redeploy.
        cmds:
            - docker compose start --wait sequin

    infra:search:apply:
        desc: Recreate Sequin to apply the reviewed configuration after database preparation.
        cmds:
            - docker compose up -d --force-recreate sequin
            - >-
                for attempt in $(seq 1 60); do
                    if docker compose exec -T sequin curl --fail --silent --show-error \
                    http://localhost:7376/health >/dev/null 2>&1;
                    then exit 0; fi;
                    sleep 2;
                done;
                docker compose logs --tail 200 sequin;
                exit 1

    infra:search:stop:
        desc: Stop Sequin before a coordinated PostgreSQL reset.
        cmds:
            - docker compose stop --timeout 30 sequin

    infra:search:state:reset:
        desc: Remove local Sequin metadata whose PostgreSQL object identities become stale after a database reset.
        internal: true
        cmds:
            - >-
                docker compose exec -T sequin-postgres
                psql --username sequin --dbname sequin --set ON_ERROR_STOP=1
                --command 'drop schema if exists sequin_streams cascade;
                drop schema if exists sequin_config cascade;
                drop schema if exists public cascade;
                create schema public;'
            - docker compose exec -T sequin-redis valkey-cli FLUSHALL

    infra:stop:
        desc: Stop persistent development infrastructure without removing it.
        cmds:
            - docker compose stop --timeout 30 postgres rustfs meilisearch sequin sequin-postgres sequin-redis

    infra:down:
        desc: Remove development infrastructure containers and networks while preserving data.
        cmds:
            - docker compose down --timeout 30 --remove-orphans

    infra:reset:
        desc: Destructively remove and recreate all persistent development infrastructure data.
        prompt: This deletes the local PostgreSQL, RustFS, and Meilisearch data. Continue?
        cmds:
            - docker compose --profile migration-test down --timeout 30 --remove-orphans --volumes
            - task: infra:up
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      prepare --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: infra:search:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      reconcile --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      promote --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}

    infra:status:
        desc: Show persistent development infrastructure status.
        cmds:
            - docker compose ps

    infra:logs:
        desc: Follow persistent development infrastructure logs.
        cmds:
            - docker compose logs --follow postgres rustfs meilisearch sequin sequin-postgres sequin-redis

    local:setup:
        desc: Start infrastructure and install or prepare the local development database.
        cmds:
            - task: infra:up
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes --if-needed
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      prepare --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: infra:search:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      reconcile --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      promote --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}

    local:search:rebuild:
        desc: Repair the local current search generation from PostgreSQL with an explicit full backfill.
        prompt: This deletes and fully rebuilds the local current Meilisearch index. Continue?
        cmds:
            - task: infra:start
            - task: services-main:db:prepare
            - task: infra:search:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      rebuild-local --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}} --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      reconcile --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      promote --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}

    local:reset:
        desc: Coordinately reset, seed, and rebuild the local database and search state.
        prompt: This deletes the local application database and Sequin state, then fully rebuilds its search index. Continue?
        cmds:
            - task: infra:start
            - task: infra:search:stop
            - task: infra:search:state:reset
            - task: services-main:db:reset
              vars:
                  CLI_ARGS: --yes
            - task: infra:search:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      rebuild-local --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}} --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      reconcile --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:search:index
              vars:
                  CLI_ARGS: >-
                      promote --projection current --index {{.MEILISEARCH_CURRENT_INDEX_UID}}
            - task: services-main:db:seed:search:check

    dev:
        desc: Run Aspire-managed applications against persistent Compose infrastructure.
        cmds:
            - task: aspire-apphost:run

    dev:search:
        desc: Alias for the default search-capable Aspire topology.
        cmds:
            - task: aspire-apphost:run:search

    dev:stop:
        desc: Stop the Aspire-managed application processes; keep Compose infrastructure running.
        cmds:
            - task: aspire-apphost:stop

    aspire:doctor:
        desc: Diagnose the local Aspire development prerequisites.
        cmds:
            - task: aspire-apphost:doctor

    aspire:describe:
        desc: Describe the running Aspire resource graph as JSON.
        cmds:
            - task: aspire-apphost:describe
