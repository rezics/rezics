version: "3"

dotenv:
    - .env
    - .env.example

includes:
    services-main:
        taskfile: ./services/main/Taskfile.yml
        dir: ./services/main
    apps-web:
        taskfile: ./apps/web/Taskfile.yml
        dir: ./apps/web
    apps-about:
        taskfile: ./apps/about/Taskfile.yml
        dir: ./apps/about
    apps-rezics-text:
        taskfile: ./apps/rezics-text/Taskfile.yml
        dir: ./apps/rezics-text
    libraries:
        taskfile: ./libraries/Taskfile.yml
        dir: ./libraries
    aspire-apphost:
        taskfile: ./aspire-apphost/Taskfile.yml
        dir: ./aspire-apphost
    packages-api:
        taskfile: ./packages/api/Taskfile.yml
        dir: ./packages/api
    packages-atlas:
        taskfile: ./packages/atlas/Taskfile.yml
        dir: ./packages/atlas
    packages-editor:
        taskfile: ./packages/editor/Taskfile.yml
        dir: ./packages/editor

tasks:
    format:
        desc: Format source files with their owning formatters.
        cmds:
            - yarn exec biome format --write .
            - task: apps-rezics-text:rust:format

    format:check:
        desc: Check source formatting with each owning formatter.
        cmds:
            - yarn exec biome format .
            - task: apps-rezics-text:rust:format:check

    counts:check:
        desc: Verify the online exact-count policy.
        cmds:
            - task: services-main:counts:check

    scc:
        desc: Count source code without generated outputs.
        cmds:
            - >-
                scc --no-gen
                --exclude-dir dist
                --exclude-dir target
                --exclude-dir generated
                --exclude-dir migrations
                --exclude-file next-env.d.ts
                --exclude-file openapi.json

    typecheck:
        desc: Type-check every application, service, and library workspace.
        cmds:
            - task: aspire-apphost:typecheck
            - task: services-main:typecheck
            - task: apps-web:typecheck
            - task: apps-about:check
            - task: libraries:typecheck
            - task: packages-api:typecheck
            - task: packages-atlas:typecheck
            - task: packages-editor:typecheck
            - task: apps-rezics-text:check

    test:
        desc: Run behavior tests for every application and service workspace.
        cmds:
            - task: libraries:access:test
            - task: libraries:avatar:test
            - task: libraries:portable-text:test
            - task: libraries:block:test
            - task: libraries:license:test
            - task: libraries:i18n:test
            - task: libraries:email:test
            - task: libraries:fixture-data:test
            - task: libraries:filter:test
            - task: libraries:observability:test
            - task: services-main:test
            - task: apps-web:test
            - task: apps-about:test
            - task: packages-api:test
            - task: packages-atlas:test
            - task: packages-editor:test
            - task: apps-rezics-text:test

    test:coverage:
        desc: Generate a local behavior-test coverage report without enforcing thresholds.
        cmds:
            - yarn exec vitest run --coverage

    db:check:
        desc: Replay main-service migrations and verify schema synchronization.
        cmds:
            - task: services-main:db:check

    openapi:generate:
        desc: Generate the OpenAPI document and Fetch SDK.
        cmds:
            - task: libraries:generate
            - task: packages-api:generate

    openapi:check:
        desc: Verify committed OpenAPI and SDK outputs are current.
        cmds:
            - task: openapi:generate
            - git diff --exit-code -- libraries/services/main/openapi/openapi.json libraries/services/main/openapi-fetch/src/generated libraries/services/main/openapi-tanstack-query/src/generated packages/api/src/generated
            - test -z "$(git ls-files --others --exclude-standard -- libraries/services/main/openapi/openapi.json libraries/services/main/openapi-fetch/src/generated libraries/services/main/openapi-tanstack-query/src/generated packages/api/src/generated)"

    seed:contract:
        desc: Verify fresh platform installation, coverage Seed, derived data, and authoritative Search.
        cmds:
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes --suppress-credential-output
            - task: services-main:platform:installation:check
            - task: services-main:db:seed
              vars:
                  CLI_ARGS: --profile coverage
            - task: services-main:search:index
              vars:
                  CLI_ARGS: check
            - task: services-main:db:seed:search:check

    infra:start:
        desc: Start persistent PostgreSQL and object storage.
        cmds:
            - docker compose up -d --wait postgres rustfs

    infra:up:
        desc: Start persistent infrastructure and idempotently initialize object storage.
        cmds:
            - task: infra:start
            - task: services-main:storage:prepare

    infra:stop:
        desc: Stop persistent development infrastructure without removing it.
        cmds:
            - docker compose stop --timeout 30 postgres rustfs

    infra:down:
        desc: Remove development infrastructure containers and networks while preserving data.
        cmds:
            - docker compose down --timeout 30 --remove-orphans

    infra:reset:
        desc: Destructively remove and recreate all persistent development infrastructure data.
        prompt: This deletes the local PostgreSQL and RustFS data. Continue?
        cmds:
            - task: services-main:db:atlas:check
            - docker compose --profile migration-test down --timeout 30 --remove-orphans --volumes
            - task: infra:up
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: check

    infra:status:
        desc: Show persistent development infrastructure status.
        cmds:
            - docker compose ps

    infra:logs:
        desc: Follow persistent development infrastructure logs.
        cmds:
            - docker compose logs --follow postgres rustfs

    local:setup:
        desc: Start infrastructure and install or prepare the local development database.
        cmds:
            - task: aspire-apphost:doctor
            - task: aspire-apphost:typecheck
            - task: infra:up
            - task: services-main:db:install
              vars:
                  CLI_ARGS: --yes --if-needed
            - task: services-main:search:index
              vars:
                  CLI_ARGS: check

    local:search:rebuild:
        desc: Rebuild the canonical local PGroonga indexes from authoritative rows.
        prompt: This locks the indexed tables while rebuilding both local PGroonga indexes. Continue?
        cmds:
            - task: infra:start
            - task: services-main:db:prepare
            - task: services-main:search:index
              vars:
                  CLI_ARGS: reindex --yes

    showcase-packs:validate:
        desc: Validate committed content in the sibling showcase-packs checkout without rebuilding it.
        internal: true
        dir: ../rezics-showcase-packs
        cmds:
            - task validate

    showcase-packs:rebuild:
        desc: Explicitly rebuild all sibling showcase packs from their configured sources.
        dir: ../rezics-showcase-packs
        cmds:
            - task rebuild

    local:showcase:
        desc: Validate and load committed sibling showcase fixtures into a freshly reset local database.
        cmds:
            - task: infra:start
            - task: showcase-packs:validate
            - task: services-main:showcase-fixtures:apply
            - task: services-main:search:index
              vars:
                  CLI_ARGS: reindex --yes
            - task: services-main:showcase-fixtures:verify

    local:reset:
        desc: Reset and seed the local database; its PGroonga indexes are maintained in-database.
        prompt: This deletes and recreates the local application database. Continue?
        cmds:
            - task: infra:start
            - task: services-main:db:reset
              vars:
                  CLI_ARGS: --yes
            - task: services-main:search:index
              vars:
                  CLI_ARGS: check
            - task: services-main:db:seed:search:check

    dev:
        desc: Run Aspire-managed applications against persistent Compose infrastructure.
        cmds:
            - task: aspire-apphost:run

    dev:stop:
        desc: Stop the Aspire-managed application processes; keep Compose infrastructure running.
        cmds:
            - task: aspire-apphost:stop

    aspire:doctor:
        desc: Diagnose the local Aspire development prerequisites.
        cmds:
            - task: aspire-apphost:doctor

    aspire:describe:
        desc: Describe the running Aspire resource graph as JSON.
        cmds:
            - task: aspire-apphost:describe
