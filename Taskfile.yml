version: "3"

includes:
  backend:
    { taskfile: ./packages/backend/Taskfile.yml, dir: ./packages/backend }
  contract:
    { taskfile: ./packages/contract/Taskfile.yml, dir: ./packages/contract }
  edge: { taskfile: ./packages/edge/Taskfile.yml, dir: ./packages/edge }
  editor: { taskfile: ./packages/editor/Taskfile.yml, dir: ./packages/editor }
  folio: { taskfile: ./packages/folio/Taskfile.yml, dir: ./packages/folio }
  frontend:
    { taskfile: ./packages/frontend/Taskfile.yml, dir: ./packages/frontend }
  job: { taskfile: ./packages/job/Taskfile.yml, dir: ./packages/job }
  job-runner:
    { taskfile: ./packages/job-runner/Taskfile.yml, dir: ./packages/job-runner }
  ui: { taskfile: ./packages/ui/Taskfile.yml, dir: ./packages/ui }

tasks:
  default:
    desc: List all available tasks
    cmd: task --list

  server:db:generate:
    desc: Generate Server Drizzle migrations
    cmd: task backend:server:db:generate

  server:db:migrate:
    desc: Apply Server Drizzle migrations
    cmd: task backend:server:db:migrate

  server:db:deploy:
    desc: Apply Server Drizzle migrations
    cmd: task backend:server:db:deploy

  server:db:studio:
    desc: Open Server Drizzle Studio
    cmd: task backend:server:db:studio

  server:dev:
    desc: Dev monolith backend (watch)
    cmd: task backend:dev

  server:dev:cluster:
    desc: Dev monolith backend cluster entrypoint (watch)
    cmd: task backend:dev:cluster

  server:build:
    desc: Compile backend native binary
    cmd: task backend:build

  server:build:linux:
    desc: Compile backend linux-x64 binary
    cmd: task backend:build:linux

  search:meilisearch:
    desc: Run local Meilisearch from the bundled binary
    dir: packages/backend/bin
    cmd: ./meilisearch --config-file-path='../meilisearch.config.toml'

  search:meilisearch:wsl:
    desc: Run local Meilisearch bound to 0.0.0.0 (WSL)
    dir: packages/backend/bin
    cmd: ./meilisearch --http-addr 0.0.0.0:7700 --config-file-path='../meilisearch.config.toml'

  # ── Dev orchestration (Nomad) ──────────────────────────────────────────
  dev:
    desc: Start development environment, Ctrl+C stops all
    cmds:
      - task: dev:setup
      - nomad-pack run deploy/dev --var project_root={{.ROOT_DIR}}
      - defer: nomad job stop rezics-dev || true
      - cmd: |-
          alloc=$(nomad job allocs -json rezics-dev | jq -r '.[] | select(.TaskGroup == "app") | .ID' | head -1)
          exec nomad alloc logs -f "$alloc" backend

  dev:stop:
    desc: Stop all services
    cmd: nomad job stop rezics-dev || true

  dev:status:
    desc: Show status of all services
    cmd: nomad job status rezics-dev

  dev:logs:
    desc: "Follow logs (usage: task dev:logs -- server)"
    cmd: |-
      alloc=$(nomad job allocs -json rezics-dev | jq -r --arg t "{{.CLI_ARGS}}" '.[] | select(.TaskStates[$t] != null) | .ID' | head -1)
      exec nomad alloc logs -f "$alloc" "{{.CLI_ARGS}}"

  dev:destroy:
    desc: Destroy all services and data
    cmds:
      - nomad job stop -purge rezics-dev 2>/dev/null || true

  dev:reset:
    desc: Destroy all data and restart
    cmds:
      - task: dev:destroy
      - task: dev

  dev:setup:
    internal: true
    cmds:
      - docker network create rezics 2>/dev/null || true
      - task: dev:agent

  dev:agent:
    internal: true
    status:
      - nomad agent-info > /dev/null 2>&1
    cmds:
      - mkdir -p .dev
      - nohup nomad agent -dev -log-level=warn -bind=127.0.0.1 -config=deploy/nomad-dev.hcl > .dev/nomad.log 2>&1 &
      - until nomad agent-info > /dev/null 2>&1; do sleep 1; done

  # ── Tests ──────────────────────────────────────────────────────────────
  test:
    desc: Run all tests (bun test, whole repo)
    cmd: bun test

  # ── Storybook ──────────────────────────────────────────────────────────
  storybook:
    desc: All Storybooks (host + every package) with color-prefixed output
    cmd: >-
      bun concurrently -k -n host,ui,editor,folio
      -c blue,cyan,magenta,green
      "task storybook:host -- --quiet --loglevel error"
      "task ui:storybook -- --quiet --loglevel error"
      "task editor:storybook -- --quiet --loglevel error"
      "task folio:storybook -- --quiet --loglevel error"
  storybook:host:
    desc: Host Storybook (port 6006)
    cmd: bun storybook dev -p 6006 --no-open {{.CLI_ARGS}}
  build:storybook:
    desc: Build every static Storybook
    cmd: >-
      bun concurrently -n host,ui,editor,folio
      -c blue,cyan,magenta,green
      "task storybook:build-host"
      "task ui:build-storybook"
      "task editor:build-storybook"
      "task folio:build-storybook"
  storybook:build-host:
    internal: true
    cmd: bun storybook build -o storybook-static
