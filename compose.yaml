name: ${COMPOSE_PROJECT_NAME:-rezics-dev}

services:
    postgres:
        image: rezics-postgres:18.4-pgroonga-4.0.8
        build:
            context: .
            target: postgres
        command:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements,pgroonga_wal_resource_manager,pgroonga_crash_safer
            - -c
            - compute_query_id=on
            - -c
            - pg_stat_statements.track=all
            - -c
            - wal_level=replica
            - -c
            - max_replication_slots=0
            - -c
            - max_wal_size=16GB
            - -c
            - min_wal_size=4GB
            - -c
            - max_worker_processes=12
            - -c
            # One official showcase pack is one atomic transaction and retains
            # its transaction advisory locks until commit. See Tag Path capacity.
            - max_locks_per_transaction=256
            - -c
            - track_io_timing=on
            - -c
            - track_wal_io_timing=on
            - -c
            - pgroonga.enable_wal_resource_manager=on
            - -c
            - pgroonga.enable_wal=off
            - -c
            - pgroonga.enable_crash_safe=on
        restart: unless-stopped
        environment:
            POSTGRES_DB: rezics
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
            REZICS_DATABASE_PASSWORD: rezics_app
            REZICS_DATABASE_USERNAME: rezics_app
            REZICS_DATABASE_BACKUP_PASSWORD: rezics_backup
            REZICS_DATABASE_BACKUP_USERNAME: rezics_backup
            REZICS_DATABASE_MONITORING_PASSWORD: rezics_monitoring
            REZICS_DATABASE_MONITORING_USERNAME: rezics_monitoring
        ports:
            - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
        volumes:
            - postgres-18-data:/var/lib/postgresql
            - ./services/main/docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d rezics"]
            interval: 2s
            timeout: 5s
            retries: 15
            start_period: 10s

    rustfs:
        image: rustfs/rustfs:1.0.0-beta.10
        restart: unless-stopped
        command: /data
        environment:
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
        ports:
            - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_HOST_PORT:-9000}:9000"
            - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
        volumes:
            - rustfs-data:/data
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
            interval: 2s
            timeout: 5s
            retries: 15
            start_period: 10s
    postgres-migration-test:
        profiles: ["migration-test"]
        image: rezics-postgres:18.4-pgroonga-4.0.8
        build:
            context: .
            target: postgres
        environment:
            POSTGRES_DB: rezics_atlas
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: postgres
        ports:
            - "${COMPOSE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_MIGRATION_HOST_PORT:-5433}:5432"
        command:
            [
                "postgres",
                "-c",
                "shared_preload_libraries=pg_stat_statements,pgroonga_wal_resource_manager,pgroonga_crash_safer",
                "-c",
                "compute_query_id=on",
                "-c",
                "pg_stat_statements.track=all",
                "-c",
                "wal_level=replica",
                "-c",
                "max_replication_slots=0",
                "-c",
                "max_wal_size=16GB",
                "-c",
                "min_wal_size=4GB",
                "-c",
                "max_worker_processes=12",
                "-c",
                # Keep migration-replay PostgreSQL aligned with local development.
                "max_locks_per_transaction=256",
                "-c",
                "track_io_timing=on",
                "-c",
                "track_wal_io_timing=on",
                "-c",
                "pgroonga.enable_wal_resource_manager=on",
                "-c",
                "pgroonga.enable_wal=off",
                "-c",
                "pgroonga.enable_crash_safe=on",
            ]
        volumes:
            - ./services/main/docker/postgres/migration-test-init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d rezics_atlas"]
            interval: 2s
            timeout: 5s
            retries: 15
            start_period: 10s

volumes:
    postgres-18-data:
        name: ${COMPOSE_VOLUME_PREFIX:-rezics}-postgres-18-data
    rustfs-data:
        name: ${COMPOSE_VOLUME_PREFIX:-rezics}-rustfs-data
