nodeLinker: node-modules

npmPreapprovedPackages:
  - native-i18n

packageExtensions:
  "@astrojs/language-server@2.16.13":
    dependencies:
      typescript: 6.0.3
  "@storybook/react@11.0.0-alpha.0":
    # The docgen worker still needs the JavaScript compiler API removed in TS 7.
    dependencies:
      typescript-docgen: "npm:typescript@6.0.3"

yarnPath: .yarn/releases/yarn-4.18.0.cjs
