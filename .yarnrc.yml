nodeLinker: node-modules

npmPreapprovedPackages:
    - native-i18n

packageExtensions:
    "@storybook/react@11.0.0-alpha.0":
        # The docgen worker needs the JavaScript compiler API removed in TypeScript 7.
        # Keep application typechecking on TS 7 and scope this parser dependency to Storybook.
        dependencies:
            typescript-docgen: "npm:typescript@6.0.3"
    "@astrojs/language-server@2.16.13":
        dependencies:
            typescript: "6.0.3"

yarnPath: .yarn/releases/yarn-4.17.1.cjs
