account:
  name: rezics

databases:
  - name: rezics-source
    hostname: ${SOURCE_DB_HOST}
    port: ${SOURCE_DB_PORT:-5432}
    database: ${SOURCE_DB_NAME:-rezics_server}
    username: ${SOURCE_DB_USER:-postgres}
    password: ${SOURCE_DB_PASSWORD}
    pool_size: ${SOURCE_DB_POOL_SIZE:-10}
    slot:
      name: rezics_sequin_slot_${ENV:-development}
      create_if_not_exists: true
    publication:
      name: rezics_sequin_pub_${ENV:-development}
      create_if_not_exists: true
      # Keep this table list in sync with packages/job-runner/src/sequin/router.ts.
      init_sql: |
        CREATE PUBLICATION rezics_sequin_pub_${ENV:-development}
        FOR TABLE
          public."HistoryOutbox",
          public."Unit",
          public."UnitTranslation",
          public."UnitTag",
          public."TagVote",
          public."UnitAlias",
          public."CreditAttribution",
          public."SubjectAttribution",
          public."UnitRealm",
          public."RealmTagApplication",
          public."ShelfItem",
          public."ContentStructureNode",
          public."Post",
          public."User",
          public."UserUnitProgress",
          public."Comment",
          public."ScoreEntry",
          public."ScoreAggregate",
          public."Feedback";
    await_database:
      timeout_ms: 30000
      interval_ms: 3000
  - name: rezics-reaction
    hostname: ${REACTION_DB_HOST}
    port: ${REACTION_DB_PORT:-5432}
    database: ${REACTION_DB_NAME:-reaction}
    username: ${REACTION_DB_USER:-postgres}
    password: ${REACTION_DB_PASSWORD}
    pool_size: ${REACTION_DB_POOL_SIZE:-5}
    slot:
      name: rezics_reaction_sequin_slot_${ENV:-development}
      create_if_not_exists: true
    publication:
      name: rezics_reaction_sequin_pub_${ENV:-development}
      create_if_not_exists: true
      init_sql: |
        CREATE PUBLICATION rezics_reaction_sequin_pub_${ENV:-development}
        FOR TABLE
          public."ReactionSummary";
    await_database:
      timeout_ms: 30000
      interval_ms: 3000

http_endpoints:
  - name: job-runner
    url: ${JOB_RUNNER_BASE_URL}
    encrypted_headers:
      - key: x-internal-secret
        value: ${SEQUIN_WEBHOOK_SECRET}

sinks:
  - name: rezics-job-runner-webhook
    database: rezics-source
    source:
      # Defense-in-depth only. The publication above is the authoritative table boundary.
      include_tables:
        - public.HistoryOutbox
        - public.Unit
        - public.UnitTranslation
        - public.UnitTag
        - public.TagVote
        - public.UnitAlias
        - public.CreditAttribution
        - public.SubjectAttribution
        - public.UnitRealm
        - public.RealmTagApplication
        - public.ShelfItem
        - public.ContentStructureNode
        - public.Post
        - public.User
        - public.UserUnitProgress
        - public.Comment
        - public.ScoreEntry
        - public.ScoreAggregate
        - public.Feedback
    destination:
      type: webhook
      http_endpoint: job-runner
      http_endpoint_path: /webhooks/sequin
      batch: false

  - name: rezics-reaction-job-runner-webhook
    database: rezics-reaction
    source:
      include_tables:
        - public.ReactionSummary
    destination:
      type: webhook
      http_endpoint: job-runner
      http_endpoint_path: /webhooks/sequin
      batch: false
