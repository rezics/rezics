# @rezics/backend — monolith backend entrypoint. Aggregated as `backend:*`.
version: "3"

tasks:
  dev:
    desc: Dev monolith backend (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/index.ts
  dev:cluster:
    desc: Dev monolith backend cluster entrypoint (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/cluster.ts
  typecheck:
    desc: Typecheck backend package
    cmd: bunx tsc -p tsconfig.json --pretty false
  history:db:generate:
    desc: Generate History Drizzle migrations
    cmd: bun drizzle-kit generate --config drizzle.history.config.ts
  history:db:migrate:
    desc: Apply History Drizzle migrations
    cmd: bun drizzle-kit migrate --config drizzle.history.config.ts
  history:db:studio:
    desc: Open History Drizzle Studio
    cmd: bun drizzle-kit studio --config drizzle.history.config.ts
  notify:db:generate:
    desc: Generate Notify Drizzle migrations
    cmd: bun drizzle-kit generate --config drizzle.notify.config.ts
  notify:db:migrate:
    desc: Apply Notify Drizzle migrations
    cmd: bun drizzle-kit migrate --config drizzle.notify.config.ts
  notify:db:studio:
    desc: Open Notify Drizzle Studio
    cmd: bun drizzle-kit studio --config drizzle.notify.config.ts
  ranking:db:generate:
    desc: Generate Ranking Drizzle migrations
    cmd: bun drizzle-kit generate --config drizzle.ranking.config.ts
  ranking:db:migrate:
    desc: Apply Ranking Drizzle migrations
    cmd: bun drizzle-kit migrate --config drizzle.ranking.config.ts
  ranking:db:studio:
    desc: Open Ranking Drizzle Studio
    cmd: bun drizzle-kit studio --config drizzle.ranking.config.ts
  reaction:db:generate:
    desc: Generate Reaction Drizzle migrations
    cmd: bun drizzle-kit generate --config drizzle.reaction.config.ts
  reaction:db:migrate:
    desc: Apply Reaction Drizzle migrations
    cmd: bun drizzle-kit migrate --config drizzle.reaction.config.ts
  reaction:db:studio:
    desc: Open Reaction Drizzle Studio
    cmd: bun drizzle-kit studio --config drizzle.reaction.config.ts
  build:
    desc: Compile native binary
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun --outfile backend
  build:linux:
    desc: Compile linux-x64 binary
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile backend
