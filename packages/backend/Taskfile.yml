version: "3"

tasks:
  dev:
    desc: Start backend dev server
    cmd: npx tsx watch src/index.ts

  build:
    desc: Build backend for production
    cmd: npx rolldown -c

  database:generate:
    desc: Generate Drizzle migrations
    cmd: npx drizzle-kit generate

  database:migrate:
    desc: Apply Drizzle migrations
    cmd: npx drizzle-kit migrate

  database:push:
    desc: Push schema directly (dev only)
    cmd: npx drizzle-kit push

  database:studio:
    desc: Open Drizzle Studio
    cmd: npx drizzle-kit studio

  auth:gen:
    desc: Generate better-auth schema
    cmd: npx @better-auth/cli generate --config ./src/services/auth/static.ts --output ./src/services/database/schema/auth.ts
