version: "3"

tasks:
    typecheck:
        desc: Type-check the public editor capability package.
        cmds:
            - yarn run typecheck
            - yarn exec tsc --noEmit -p tsconfig.stories.json

    test:
        desc: Run editor capability behavior tests.
        cmds:
            - yarn run test

    build:
        desc: Build the publishable editor capability package.
        cmds:
            - yarn run build
