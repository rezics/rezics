version: "3"

tasks:
  dev:
    desc: Start frontend dev server
    cmd: npx next dev --turbopack -p ${PORT:-35001}

  build:
    desc: Build frontend for production
    cmd: npx next build

  start:
    desc: Start production server
    cmd: npx next start

  cosmos:
    desc: Start React Cosmos component explorer
    cmds:
      - |
        bash -lc '
          set -euo pipefail
          export NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=8192"
          trap "jobs -pr | xargs -r kill" EXIT
          npx next dev --turbopack -p 35002 &
          npx cosmos --config cosmos.config.json --expose-imports
        '
