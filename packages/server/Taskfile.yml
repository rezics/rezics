# @rezics/server — compatibility task aliases for the backend-owned server.
version: "3"

tasks:
  db:generate:
    desc: Generate Drizzle migrations
    cmd: task -d ../backend server:db:generate
  db:migrate:
    desc: Apply Drizzle migrations
    cmd: task -d ../backend server:db:migrate
  db:deploy:
    desc: Apply Drizzle migrations
    cmd: task -d ../backend server:db:deploy
  db:studio:
    desc: Open Drizzle Studio
    cmd: task -d ../backend server:db:studio
  dev:
    desc: Dev monolith backend (watch)
    cmd: task -d ../backend dev
  dev:cluster:
    desc: Dev monolith backend cluster entrypoint (watch)
    cmd: task -d ../backend dev:cluster
  build:
    desc: Compile backend native binary
    cmd: task -d ../backend build
  build:linux:
    desc: Compile backend linux-x64 binary
    cmd: task -d ../backend build:linux
