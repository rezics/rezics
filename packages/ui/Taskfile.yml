# @rezics/ui — component library + Storybook. Aggregated as `ui:*`.
version: '3'

tasks:
  dev:
    desc: Watch build
    cmd: bun run --watch src/index.ts
  test:
    desc: Run tests
    cmd: bun test
  storybook:
    desc: Storybook (port 6007)
    cmd: bun storybook dev -p 6007 --no-open {{.CLI_ARGS}}
  build-storybook:
    desc: Build the static Storybook
    cmd: bun storybook build -o storybook-static
