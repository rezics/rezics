# @rezics/notify — notify service. Aggregated as `notify:*`.
version: '3'

tasks:
  db:generate:
    desc: Generate Drizzle migrations
    cmd: bun drizzle-kit generate
  db:migrate:
    desc: Apply Drizzle migrations
    cmd: bun drizzle-kit migrate
  db:deploy:
    desc: Apply Drizzle migrations
    cmds:
      - task: db:migrate
  db:studio:
    desc: Open Drizzle Studio
    cmd: bun drizzle-kit studio
  dev:
    desc: Dev (watch)
    env:
      NODE_ENV: development
    cmd: bun run --watch --no-cache src/index.ts
  build:
    desc: Compile native binary
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun --outfile notify
  build:linux:
    desc: Compile linux-x64 binary (mirrors Dockerfile.notify)
    cmd: bun build src/cluster.ts --compile --minify-whitespace --minify-syntax --target bun-linux-x64 --outfile notify
