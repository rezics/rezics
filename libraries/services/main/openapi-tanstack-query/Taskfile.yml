version: "3"

tasks:
    generate:
        desc: Generate the TanStack Query SDK from the OpenAPI document.
        cmds:
            - KUBB_DISABLE_TELEMETRY=1 yarn exec kubb generate --config ./kubb.config.ts

    typecheck:
        desc: Type-check the TanStack Query SDK.
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.json
