version: "3"

includes:
    content-adapters:
        taskfile: ./content-adapters/Taskfile.yml
        dir: ./content-adapters
    schema-importer:
        taskfile: ./schema-importer/Taskfile.yml
        dir: ./schema-importer
    schema:
        taskfile: ./schema/Taskfile.yml
        dir: ./schema
    reference:
        taskfile: ./reference/Taskfile.yml
        dir: ./reference
    content-language:
        taskfile: ./content-language/Taskfile.yml
        dir: ./content-language
    access:
        taskfile: ./access/Taskfile.yml
        dir: ./access
    avatar:
        taskfile: ./avatar/Taskfile.yml
        dir: ./avatar
    observability:
        taskfile: ./observability/Taskfile.yml
        dir: ./observability
    block:
        taskfile: ./block/Taskfile.yml
        dir: ./block
    filter:
        taskfile: ./filter/Taskfile.yml
        dir: ./filter
    slug:
        taskfile: ./slug/Taskfile.yml
        dir: ./slug
    license:
        taskfile: ./license/Taskfile.yml
        dir: ./license
    i18n:
        taskfile: ./i18n/Taskfile.yml
        dir: ./i18n
    email:
        taskfile: ./email/Taskfile.yml
        dir: ./email
    fixture-data:
        taskfile: ./fixture-data/Taskfile.yml
        dir: ./fixture-data
    fixture-client:
        taskfile: ./fixture-client/Taskfile.yml
        dir: ./fixture-client
    ui:
        taskfile: ./ui/Taskfile.yml
        dir: ./ui
    portable-text:
        taskfile: ./portable-text/Taskfile.yml
        dir: ./portable-text
    openapi:
        taskfile: ./services/main/openapi/Taskfile.yml
        dir: ./services/main/openapi
    openapi-fetch:
        taskfile: ./services/main/openapi-fetch/Taskfile.yml
        dir: ./services/main/openapi-fetch
    openapi-tanstack-query:
        taskfile: ./services/main/openapi-tanstack-query/Taskfile.yml
        dir: ./services/main/openapi-tanstack-query

tasks:
    artifacts:fetch:
        desc: Restore normative vocabulary pins and fetch current provider contracts over HTTPS.
        cmds:
            - task: schema-importer:fetch
              vars: { CLI_ARGS: all }
            - task: content-adapters:fetch-contracts
              vars: { CLI_ARGS: all }

    artifacts:generate:
        desc: Regenerate local schema declarations, inventories and reports from restored inputs.
        cmds:
            - task: schema-importer:generate
            - task: schema:catalogue
            - task: content-adapters:contracts
              vars: { CLI_ARGS: all }

    artifacts:prepare:
        desc: Restore normative vocabularies, fetch current providers and generate ignored artifacts.
        cmds:
            - task: artifacts:fetch
            - task: artifacts:generate

    generate:
        desc: Generate the OpenAPI document and SDKs.
        cmds:
            - task: openapi:generate
            - task: openapi-fetch:generate
            - task: openapi-tanstack-query:generate

    typecheck:
        desc: Type-check library packages.
        cmds:
            - task: schema:typecheck
            - task: schema-importer:typecheck
            - task: content-adapters:typecheck
            - task: reference:typecheck
            - task: content-language:typecheck
            - task: access:typecheck
            - task: avatar:typecheck
            - task: observability:typecheck
            - task: block:typecheck
            - task: filter:typecheck
            - task: slug:typecheck
            - task: license:typecheck
            - task: i18n:check
            - task: email:typecheck
            - task: fixture-data:typecheck
            - task: fixture-client:typecheck
            - task: ui:typecheck
            - task: portable-text:typecheck
            - task: openapi:typecheck
            - task: openapi-fetch:typecheck
            - task: openapi-tanstack-query:typecheck
