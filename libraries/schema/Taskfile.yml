version: "3"

tasks:
    catalogue:
        desc: Generate the complete table, field, key and index catalogue from the production Drizzle exports.
        cmds:
            - yarn exec tsx scripts/catalogue.ts
    typecheck:
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.json
    test:
        dir: ../..
        cmds:
            - yarn exec vitest run --project schema
