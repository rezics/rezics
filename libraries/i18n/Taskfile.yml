version: "3"

tasks:
    typecheck:
        desc: Type-check the internationalization package.
        cmds:
            - yarn exec tsc --noEmit -p tsconfig.json

    test:
        desc: Test localization policy behavior.
        cmds:
            - yarn exec vitest run --config vitest.config.ts

    policy:check:
        desc: Enforce canonical terminology, verbatim terms, and localized prose.
        cmds:
            - yarn node scripts/check-localization.mjs

    terminology:generate:
        desc: Generate human- and tool-readable terminology exports.
        cmds:
            - yarn node scripts/generate-terminology.mjs

    terminology:check:
        desc: Verify generated terminology exports are current.
        cmds:
            - yarn node scripts/generate-terminology.mjs --check

    check:
        desc: Type-check the package and enforce localization policy.
        cmds:
            - task: typecheck
            - task: terminology:check
            - task: policy:check
