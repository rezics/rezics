# Kamal shared base configuration.
#
# Each deployable unit has its own destination file `config/deploy.<unit>.yml`
# that is merged on top of this base, e.g.:
#
#   kamal deploy -d server -c config/deploy.yml      # (destination merges base)
#
# In practice every command is invoked through a destination, so run e.g.
# `kamal deploy -d server`. This base file holds only the settings shared by
# every unit: the GHCR registry, the SSH target, builder defaults, the shared
# observability env, and the self-hosted infrastructure accessories.
#
# Hostnames/IPs below are placeholders (RFC 5737 TEST-NET / `.example`) and MUST
# be replaced for a real host. See config/README.md for the full topology.

# Overridden by every destination; present so the base validates standalone.
service: rezics
image: rezics/rezics-server

# Production host. A single VPS in v1 (database-per-service on one Postgres
# instance); split later by moving a unit's host + connection URL.
servers:
  web:
    - 203.0.113.10

# Images are built and pushed to GHCR in CI; production deploy pulls the
# immutable git-SHA tag (`kamal deploy --version <sha> --skip-push`).
registry:
  server: ghcr.io
  username: rezics
  password:
    - KAMAL_REGISTRY_PASSWORD

# amd64 Linux images via the shared base + thin per-service Dockerfiles.
# Each destination sets its own `builder.dockerfile`.
builder:
  arch: amd64
  context: .

ssh:
  user: deploy

# Non-secret values shared by every backend unit. Secret values live in the
# per-unit SOPS files surfaced through `.kamal/secrets` (see config/README.md).
env:
  clear:
    NODE_ENV: production
    OBSERVABILITY_LOG_FORMAT: json
    # OTLP export is opt-in: set only when the infra-observability unit is up.
    # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    # OBSERVABILITY_TELEMETRY: enabled

# Self-hosted infrastructure. Each accessory is an independently bootable unit
# (`kamal accessory boot postgres`, `kamal accessory reboot meilisearch`, ...).
# They are NOT touched by `kamal deploy`; manage them with `kamal accessory`.
accessories:
  # infra-db: one PostgreSQL instance, database-per-service (logical wal for CDC).
  postgres:
    image: postgres:18.4-trixie
    host: 203.0.113.10
    port: "127.0.0.1:5432:5432"
    cmd: >-
      postgres -c wal_level=logical -c max_replication_slots=10
      -c max_wal_senders=10
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
      # Bootstraps one role+database per service on first run.
      - infra/postgres/init:/docker-entrypoint-initdb.d:ro

  # infra-search: Meilisearch (server + ranking + job-runner consume it).
  meilisearch:
    image: getmeili/meilisearch:v1.45.0
    host: 203.0.113.10
    port: "127.0.0.1:7700:7700"
    env:
      clear:
        MEILI_ENV: production
        MEILI_NO_ANALYTICS: "true"
      secret:
        - MEILI_MASTER_KEY
    directories:
      - meili-data:/meili_data

  # infra-cdc state store for Sequin (its own Postgres + Redis).
  sequin-postgres:
    image: postgres:18.4-trixie
    host: 203.0.113.10
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_DB: sequin
        POSTGRES_USER: sequin
      secret:
        - POSTGRES_PASSWORD
    directories:
      - sequin-postgres-data:/var/lib/postgresql/data

  sequin-redis:
    image: redis:8.8-m03-alpine3.23
    host: 203.0.113.10
    port: "127.0.0.1:6379:6379"
    directories:
      - sequin-redis-data:/data

  # infra-cdc: Sequin streams the main + reaction databases (two sources, two
  # replication slots) to job-runner webhooks. See package/job-runner/sequin/
  # sequin.yml for the source/publication/slot definitions.
  sequin:
    image: sequin/sequin:v0.14.6
    host: 203.0.113.10
    port: "127.0.0.1:7376:7376"
    env:
      clear:
        ENV: production
        CONFIG_FILE_PATH: /config/sequin.yml
        # Sequin's own state store.
        PG_HOSTNAME: rezics-sequin-postgres
        PG_PORT: "5432"
        PG_DATABASE: sequin
        PG_USERNAME: sequin
        # Source 1: main database.
        SOURCE_DB_HOST: rezics-postgres
        SOURCE_DB_PORT: "5432"
        SOURCE_DB_NAME: rezics_server
        SOURCE_DB_USER: postgres
        # Source 2: reaction database (same instance, separate db).
        REACTION_DB_HOST: rezics-postgres
        REACTION_DB_PORT: "5432"
        REACTION_DB_NAME: rezics_reaction
        REACTION_DB_USER: postgres
        JOB_RUNNER_BASE_URL: http://rezics-job-runner:3005
      secret:
        - PG_PASSWORD
        - SECRET_KEY_BASE
        - VAULT_KEY
        - SEQUIN_WEBHOOK_SECRET
        - SOURCE_DB_PASSWORD
        - REACTION_DB_PASSWORD
    files:
      - package/job-runner/sequin/sequin.yml:/config/sequin.yml

  # infra-observability (opt-in): local OTel Collector fan-in.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    host: 203.0.113.10
    port: "127.0.0.1:4317:4317"
    cmd: "--config=/etc/otelcol-contrib/config.yml"
    files:
      - tool/external-services/otel-collector.yml:/etc/otelcol-contrib/config.yml
