# auth — public auth service (proxied, TLS via kamal-proxy).
#   kamal deploy -d auth --version <sha> --skip-push
service: rezics-auth
image: rezics/rezics-auth

builder:
  dockerfile: docker/auth.Dockerfile

servers:
  web:
    - 203.0.113.10

proxy:
  ssl: true
  host: auth.rezics.example
  app_port: 3001
  healthcheck:
    path: /health
    interval: 5

env:
  clear:
    PORT: "3001"
    BETTER_AUTH_URL: https://auth.rezics.example
    AUTH_PUBLIC_BASE_URL: https://auth.rezics.example
    AUTH_PUBLIC_ISSUER_URL: https://auth.rezics.example
    SMTP_HOST: smtp.rezics.example
  secret:
    - DATABASE_URL
    - BETTER_AUTH_SECRET
    - AUTH_INTERNAL_TOKEN_GATEWAY_SECRET
    - SMTP_USER
    - SMTP_PASSWORD
    - TURNSTILE_SECRET
    # OAuth providers are optional; add the pairs you enable:
    # - GOOGLE_CLIENT_ID
    # - GOOGLE_CLIENT_SECRET
