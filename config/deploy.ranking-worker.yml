# ranking-worker — dedicated worker that consumes ONLY the ranking lane, so
# ranking recompute bursts cannot starve the default lanes. Same image as
# job-runner, role-switched. Internal, no HTTP port. Scaled independently.
#   kamal deploy -d ranking-worker --version <sha> --skip-push
service: rezics-ranking-worker
image: rezics/rezics-job-runner

builder:
  dockerfile: docker/job-runner.Dockerfile

servers:
  worker:
    hosts:
      - 203.0.113.10
    proxy: false

env:
  clear:
    JOB_RUNNER_ROLE: worker
    JOB_WORKER_LANES: ranking
    WORKERS: "1"
    MEILI_HOST: http://rezics-meilisearch:7700
    RANKING_BASE_URL: http://rezics-ranking:3006
  secret:
    - JOB_DATABASE_URL
    - SERVER_DATABASE_URL
    - HISTORY_DATABASE_URL
    - MEILI_MASTER_KEY
    - JOB_RUNNER_INTERNAL_SECRET
    - SEQUIN_WEBHOOK_SECRET
    - RANKING_INTERNAL_SECRET
