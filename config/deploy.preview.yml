# preview — bot-friendly HTML/XML preview origin (proxied for edge).
#   kamal deploy -d preview --version <sha> --skip-push
service: rezics-preview
image: rezics/rezics-preview

builder:
  dockerfile: docker/preview.Dockerfile

servers:
  web:
    - 203.0.113.10

proxy:
  ssl: true
  host: preview.rezics.example
  app_port: 3006
  healthcheck:
    path: /health
    interval: 5

env:
  clear:
    SERVER_PORT: "3006"
    AUTH_INTERNAL_BASE_URL: http://rezics-auth:3001
    AUTH_PUBLIC_BASE_URL: https://auth.rezics.example
    AUTH_PUBLIC_ISSUER_URL: https://auth.rezics.example
    NOTIFY_BASE_URL: http://rezics-notify:3002
    REACTION_BASE_URL: http://rezics-reaction:3003
    HISTORY_BASE_URL: http://rezics-history:3004
    JOB_RUNNER_BASE_URL: http://rezics-job-runner:3005
    MEILI_HOST: http://rezics-meilisearch:7700
  secret:
    - DATABASE_URL
    - AUTH_INTERNAL_TOKEN_GATEWAY_SECRET
    - SMTP_HOST
    - SMTP_USER
    - SMTP_PASSWORD
    - TURNSTILE_SECRET
    - MEILI_MASTER_KEY
    - NOTIFY_INTERNAL_SECRET
    - REACTION_INTERNAL_SECRET
    - JOB_RUNNER_INTERNAL_SECRET
