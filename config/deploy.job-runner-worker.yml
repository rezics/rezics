# job-runner-worker — consumes the default lanes (search / history /
# maintenance), NOT ranking. Same image as job-runner, role-switched. Internal,
# no HTTP port. Scale via `WORKERS` and replica count independently of the
# HTTP intake and the ranking-worker.
#   kamal deploy -d job-runner-worker --version <sha> --skip-push
service: rezics-job-runner-worker
image: rezics/rezics-job-runner

builder:
  dockerfile: docker/job-runner.Dockerfile

servers:
  worker:
    hosts:
      - 203.0.113.10
    proxy: false

env:
  clear:
    JOB_RUNNER_ROLE: worker
    JOB_WORKER_LANES: default
    WORKERS: "2"
    MEILI_HOST: http://rezics-meilisearch:7700
  secret:
    - JOB_DATABASE_URL
    - SERVER_DATABASE_URL
    - HISTORY_DATABASE_URL
    - MEILI_MASTER_KEY
    - JOB_RUNNER_INTERNAL_SECRET
    - SEQUIN_WEBHOOK_SECRET
