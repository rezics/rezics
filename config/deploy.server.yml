# server — public API (proxied, TLS via kamal-proxy).
#   kamal deploy -d server --version <sha> --skip-push
service: rezics-server
image: rezics/rezics-server

builder:
  dockerfile: docker/server.Dockerfile

servers:
  web:
    - 203.0.113.10

proxy:
  ssl: true
  host: api.rezics.example
  app_port: 3000
  healthcheck:
    path: /health
    interval: 5

env:
  clear:
    PORT: "3000"
    AUTH_INTERNAL_BASE_URL: http://rezics-auth:3001
    AUTH_PUBLIC_BASE_URL: https://auth.rezics.example
    AUTH_PUBLIC_ISSUER_URL: https://auth.rezics.example
    NOTIFY_BASE_URL: http://rezics-notify:3002
    REACTION_BASE_URL: http://rezics-reaction:3003
    HISTORY_BASE_URL: http://rezics-history:3004
    JOB_RUNNER_BASE_URL: http://rezics-job-runner:3005
    MEILI_HOST: http://rezics-meilisearch:7700
    STATUS_JOB_RUNNER_URL: http://rezics-job-runner:3005
    STATUS_SEQUIN_UI_URL: http://127.0.0.1:7376
    STATUS_SEQUIN_HEALTH_URL: http://rezics-sequin:7376/health
    STATUS_SEQUIN_WEBHOOK_TARGET_NAME: job-runner /webhooks/sequin
    STATUS_CDC_PUBLICATION_NAME: rezics_sequin_pub_production
    STATUS_CDC_REPLICATION_SLOT_NAME: rezics_sequin_slot_production
    STATUS_REACTION_CDC_PUBLICATION_NAME: rezics_reaction_sequin_pub_production
    STATUS_REACTION_CDC_REPLICATION_SLOT_NAME: rezics_reaction_sequin_slot_production
    STATUS_CDC_LAG_WARNING_BYTES: "268435456"
  secret:
    - DATABASE_URL
    - AUTH_INTERNAL_TOKEN_GATEWAY_SECRET
    - SMTP_HOST
    - SMTP_USER
    - SMTP_PASSWORD
    - TURNSTILE_SECRET
    - MEILI_MASTER_KEY
    - NOTIFY_INTERNAL_SECRET
    - REACTION_INTERNAL_SECRET
    - JOB_RUNNER_INTERNAL_SECRET
    - STATUS_REACTION_DATABASE_URL
