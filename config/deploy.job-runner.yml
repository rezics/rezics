# job-runner (HTTP intake) — Sequin webhooks + enqueue API. Internal; addressed
# by container DNS (rezics-job-runner:3005). The worker roles are separate units
# (deploy.job-runner-worker.yml, deploy.ranking-worker.yml) so HTTP and workers
# deploy and scale independently and the HTTP alias never resolves to a
# non-listening worker container.
#   kamal deploy -d job-runner --version <sha> --skip-push
service: rezics-job-runner
image: rezics/rezics-job-runner

builder:
  dockerfile: docker/job-runner.Dockerfile

servers:
  web:
    hosts:
      - 203.0.113.10
    proxy: false

env:
  clear:
    JOB_RUNNER_ROLE: http
    PORT: "3005"
    MEILI_HOST: http://rezics-meilisearch:7700
    SEQUIN_HEALTH_URL: http://rezics-sequin:7376/health
  secret:
    - JOB_DATABASE_URL
    - SERVER_DATABASE_URL
    - HISTORY_DATABASE_URL
    - MEILI_MASTER_KEY
    - JOB_RUNNER_INTERNAL_SECRET
    - SEQUIN_WEBHOOK_SECRET
